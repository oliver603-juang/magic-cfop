<script>
// ===== CONSTANTS =====
const SCAN_SEQ=[
  {f:'F',name:'❶ 前紅',guide:'白色朝上，紅色面對鏡頭'},
  {f:'R',name:'❷ 右藍',guide:'整顆左轉 90°（藍色面對鏡頭）'},
  {f:'D',name:'❸ 下黃',guide:'整顆往上翻 90°（黃色面對鏡頭）'},
  {f:'B',name:'❹ 後橘',guide:'整顆左轉 90°（橘色面對鏡頭）'},
  {f:'L',name:'❺ 左綠',guide:'整顆往上翻 90°（綠色面對鏡頭）'},
  {f:'U',name:'❻ 上白',guide:'整顆左轉 90°（白色面對鏡頭）'},
];
const CMAP={W:'#FFFFFF',R:'#B71234',B:'#0046AD',O:'#FF5800',G:'#009B48',Y:'#FFD500'};
const CC={F:'R',R:'B',B:'O',L:'G',U:'W',D:'Y'};
const C2F={W:'U',B:'R',R:'F',Y:'D',G:'L',O:'B'};
const FLABEL={U:'上白',R:'右藍',F:'前紅',D:'下黃',L:'左綠',B:'後橘'};
const MDESC_KID={};
MDESC_KID['R']='右邊 推上去 ⬆';MDESC_KID["R'"]='右邊 拉下來 ⬇';MDESC_KID['R2']='右邊 推兩次 ⬆⬆';
MDESC_KID['U']='上面 往左推 ⬅';MDESC_KID["U'"]='上面 往右推 ➡';MDESC_KID['U2']='上面 轉半圈';
MDESC_KID['D']='下面 往右推 ➡';MDESC_KID["D'"]='下面 往左推 ⬅';MDESC_KID['D2']='下面 轉半圈';
MDESC_KID['L']='左邊 拉下來 ⬇';MDESC_KID["L'"]='左邊 推上去 ⬆';MDESC_KID['L2']='左邊 推兩次';
MDESC_KID['F']='正面 順時針轉 ↻';MDESC_KID["F'"]='正面 逆時針轉 ↺';MDESC_KID['F2']='正面 轉半圈';
MDESC_KID['B']='後面 順時針轉 ↻';MDESC_KID["B'"]='後面 逆時針轉 ↺';MDESC_KID['B2']='後面 轉半圈';
window.CN={W:'白',B:'藍',R:'紅',Y:'黃',G:'綠',O:'橘'};

let vid,ov,octx;
let rawData={},faceColors={},cubeState={};
let scanIdx=0,solution=[],solveStep=-1;
let mode='start';

// ===== CAMERA =====
async function startApp(){
  document.getElementById('startOv').classList.remove('show');
  vid=document.getElementById('vid');ov=document.getElementById('ov');octx=ov.getContext('2d');
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
    vid.srcObject=s;await vid.play();
    // Torch OFF — rely on ambient lighting for more natural color reading
    const track=s.getVideoTracks()[0];
    window._torchOn=false;
    ov.width=vid.videoWidth||720;ov.height=vid.videoHeight||1280;
    mode='scan';scanIdx=0;showScanUI();
  }catch(e){alert('相機錯誤: '+e.message);}
}
function startManual(){
  document.getElementById('startOv').classList.remove('show');
  document.getElementById('startOv').style.display='none';
  document.querySelector('.wrap').style.background='#000';
  if(vid)vid.style.display='none';
  ['U','R','F','D','L','B'].forEach(f=>{faceColors[f]=['W','W','W','W',CC[f],'W','W','W','W'];});
  // Set centers correctly
  faceColors.U[4]='W';faceColors.R[4]='B';faceColors.F[4]='R';faceColors.D[4]='Y';faceColors.L[4]='G';faceColors.B[4]='O';
  document.getElementById('topBar').style.display='block';
  document.getElementById('botBar').style.display='block';
  document.getElementById('title').textContent='✏️ 手動輸入';
  document.getElementById('sub').textContent='點擊格子切換顏色，中心格不能改';
  document.getElementById('info').textContent='完成後按下方按鈕';
  showEditableFaces();
  document.getElementById('btnRow').innerHTML='<button class="btn" onclick="doManualSolve()">🧩 LBL 解題！</button>';
}

// ===== CORNER-SHOT SCAN (2 photos, 3 faces each) =====
const CORNER_SHOTS = [
  { id:1, label:'Shot 1', desc:'白色朝上，紅藍角對準鏡頭',
    faces:['U','F','R'], colors:['#E8E8E8','#D42020','#1E6ED8'],
    colorLabels:['白(U)','紅(F)','藍(R)'] },
  { id:2, label:'Shot 2', desc:'翻轉180°，黃色朝上，橘綠角對準鏡頭',
    faces:['D','B','L'], colors:['#E8D020','#F07010','#18A040'],
    colorLabels:['黃(D)','橘(B)','綠(L)'] }
];

// Isometric projection helper: (x,y,z) -> (px,py), scale=1 per sticker unit
function isoProject(x,y,z){
  const c30=0.866025,s30=0.5;
  return [(x-y)*c30, (x+y)*s30-z];
}

// Build the SVG overlay path for the isometric cube guide
function buildIsoGuide(cx,cy,cellPx){
  const S=cellPx; // pixels per cell
  const lines=[];
  function p(x,y,z){const[px,py]=isoProject(x*S,y*S,z*S);return[cx+px,cy+py];}
  // Outer edges (visible 9 of 12)
  const v=[[0,0,0],[3,0,0],[3,3,0],[0,3,0],[0,0,3],[3,0,3],[3,3,3],[0,3,3]];
  const edges=[[4,5],[5,6],[4,7],[5,1],[6,2],[7,3],[4,0],[0,1],[0,3]];
  const outerPaths=edges.map(([a,b])=>{
    const pa=p(...v[a]),pb=p(...v[b]);
    return `M${pa[0].toFixed(1)},${pa[1].toFixed(1)}L${pb[0].toFixed(1)},${pb[1].toFixed(1)}`;
  });
  // Grid lines: U face (z=3)
  const gridPaths=[];
  for(let i=1;i<3;i++){
    let a=p(i,0,3),b=p(i,3,3);gridPaths.push(`M${a[0].toFixed(1)},${a[1].toFixed(1)}L${b[0].toFixed(1)},${b[1].toFixed(1)}`);
    a=p(0,i,3);b=p(3,i,3);gridPaths.push(`M${a[0].toFixed(1)},${a[1].toFixed(1)}L${b[0].toFixed(1)},${b[1].toFixed(1)}`);
  }
  // F face (y=0)
  for(let i=1;i<3;i++){
    let a=p(i,0,0),b=p(i,0,3);gridPaths.push(`M${a[0].toFixed(1)},${a[1].toFixed(1)}L${b[0].toFixed(1)},${b[1].toFixed(1)}`);
    a=p(0,0,i);b=p(3,0,i);gridPaths.push(`M${a[0].toFixed(1)},${a[1].toFixed(1)}L${b[0].toFixed(1)},${b[1].toFixed(1)}`);
  }
  // R face (x=3)
  for(let i=1;i<3;i++){
    let a=p(3,i,0),b=p(3,i,3);gridPaths.push(`M${a[0].toFixed(1)},${a[1].toFixed(1)}L${b[0].toFixed(1)},${b[1].toFixed(1)}`);
    a=p(3,0,i);b=p(3,3,i);gridPaths.push(`M${a[0].toFixed(1)},${a[1].toFixed(1)}L${b[0].toFixed(1)},${b[1].toFixed(1)}`);
  }
  // Cell centers for sampling (row,col within each face)
  // U face: z=3, x=col, y=row (row0=front, row2=back)
  const uCenters=[];
  for(let r=0;r<3;r++)for(let c=0;c<3;c++)uCenters.push(p(c+.5,r+.5,3));
  // F face: y=0, x=col, z=2.5-row (row0=top)
  const fCenters=[];
  for(let r=0;r<3;r++)for(let c=0;c<3;c++)fCenters.push(p(c+.5,0,2.5-r));
  // R face: x=3, y=col, z=2.5-row (row0=top, col0=front)
  const rCenters=[];
  for(let r=0;r<3;r++)for(let c=0;c<3;c++)rCenters.push(p(3,c+.5,2.5-r));

  // Face fill polygons for tinted overlay
  const uPoly=[p(0,0,3),p(3,0,3),p(3,3,3),p(0,3,3)].map(([x,y])=>x.toFixed(1)+','+y.toFixed(1)).join(' ');
  const fPoly=[p(0,0,0),p(3,0,0),p(3,0,3),p(0,0,3)].map(([x,y])=>x.toFixed(1)+','+y.toFixed(1)).join(' ');
  const rPoly=[p(3,0,0),p(3,3,0),p(3,3,3),p(3,0,3)].map(([x,y])=>x.toFixed(1)+','+y.toFixed(1)).join(' ');

  return {outerPaths,gridPaths,uCenters,fCenters,rCenters,uPoly,fPoly,rPoly};
}

let cornerShotIdx=0;
async function startCornerScan(){
  document.getElementById('startOv').classList.remove('show');
  document.getElementById('startOv').style.display='none';
  vid=document.getElementById('vid');ov=document.getElementById('ov');octx=ov.getContext('2d');
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
    vid.srcObject=s;await vid.play();
    ov.width=vid.videoWidth||720;ov.height=vid.videoHeight||1280;
    cornerShotIdx=0;rawData={};
    document.getElementById('topBar').style.display='block';
    document.getElementById('botBar').style.display='block';
    showCornerShotUI();
  }catch(e){alert('相機錯誤: '+e.message);}
}

function showCornerShotUI(){
  const shot=CORNER_SHOTS[cornerShotIdx];
  document.getElementById('title').textContent='🎯 '+shot.label;
  document.getElementById('sub').textContent=shot.desc;
  document.getElementById('dots').innerHTML=CORNER_SHOTS.map((_,i)=>'<div class="td'+(i<cornerShotIdx?' done':'')+(i===cornerShotIdx?' now':'')+'"></div>').join('');
  document.getElementById('info').textContent='對齊魔方到引導框，按拍照';
  document.getElementById('btnRow').innerHTML='<button class="btn" onclick="captureCornerShot()">📸 拍照</button>';
  // Draw guide overlay
  drawCornerGuide();
  if(!window._cornerRAF)window._cornerRAF=requestAnimationFrame(function loop(){drawCornerGuide();window._cornerRAF=requestAnimationFrame(loop);});
}

function drawCornerGuide(){
  if(!octx||!vid)return;
  const w=ov.width,h=ov.height;
  octx.clearRect(0,0,w,h);
  const shot=CORNER_SHOTS[cornerShotIdx];
  // Cell size: use ~18% of min dimension
  const cellPx=Math.min(w,h)*0.14;
  const cx=w*0.5, cy=h*0.45;
  const g=buildIsoGuide(cx,cy,cellPx);
  // Semi-transparent face fills
  octx.globalAlpha=0.08;
  [['uPoly',shot.colors[0]],['fPoly',shot.colors[1]],['rPoly',shot.colors[2]]].forEach(([key,color])=>{
    const pts=g[key].split(' ').map(s=>{const[x,y]=s.split(',');return[+x,+y];});
    octx.fillStyle=color;octx.beginPath();pts.forEach(([x,y],i)=>i?octx.lineTo(x,y):octx.moveTo(x,y));octx.closePath();octx.fill();
  });
  octx.globalAlpha=1;
  // Outer edges
  octx.strokeStyle='rgba(255,255,255,0.9)';octx.lineWidth=2;
  g.outerPaths.forEach(d=>{const pts=d.replace('M','').split('L').map(s=>{const[x,y]=s.split(',');return[+x,+y];});octx.beginPath();octx.moveTo(pts[0][0],pts[0][1]);octx.lineTo(pts[1][0],pts[1][1]);octx.stroke();});
  // Grid lines
  octx.strokeStyle='rgba(255,255,255,0.4)';octx.lineWidth=1;
  g.gridPaths.forEach(d=>{const pts=d.replace('M','').split('L').map(s=>{const[x,y]=s.split(',');return[+x,+y];});octx.beginPath();octx.moveTo(pts[0][0],pts[0][1]);octx.lineTo(pts[1][0],pts[1][1]);octx.stroke();});
  // Sampling dots
  const dotSets=[
    {centers:g.uCenters,color:shot.colors[0]},
    {centers:g.fCenters,color:shot.colors[1]},
    {centers:g.rCenters,color:shot.colors[2]}
  ];
  dotSets.forEach(({centers,color})=>{
    centers.forEach(([x,y],i)=>{
      octx.fillStyle=i===4?'#FFD700':color;
      octx.globalAlpha=i===4?1:0.6;
      octx.beginPath();octx.arc(x,y,i===4?5:3,0,Math.PI*2);octx.fill();
    });
  });
  octx.globalAlpha=1;
  // Face labels
  octx.font='bold 14px sans-serif';octx.textAlign='center';
  const labelPos=[g.uCenters[4],g.fCenters[4],g.rCenters[4]];
  shot.colorLabels.forEach((lbl,i)=>{
    const[x,y]=labelPos[i];
    octx.fillStyle='rgba(0,0,0,0.6)';octx.fillRect(x-22,y+8,44,16);
    octx.fillStyle='#fff';octx.fillText(lbl,x,y+20);
  });
}

function captureCornerShot(){
  if(window._cornerRAF){cancelAnimationFrame(window._cornerRAF);window._cornerRAF=null;}
  const shot=CORNER_SHOTS[cornerShotIdx];
  const w=vid.videoWidth,h=vid.videoHeight;
  const tc=document.createElement('canvas');tc.width=w;tc.height=h;
  const tctx=tc.getContext('2d');tctx.drawImage(vid,0,0,w,h);
  const cellPx=Math.min(w,h)*0.14;
  const cx=w*0.5,cy=h*0.45;
  const g=buildIsoGuide(cx,cy,cellPx);
  // Sample each face's 9 cells
  const sampleRadius=Math.max(3,Math.round(cellPx*0.12));
  function sampleAt(px,py){
    const r=sampleRadius,d=tctx.getImageData(Math.max(0,Math.round(px)-r),Math.max(0,Math.round(py)-r),r*2+1,r*2+1);
    let rr=0,gg=0,bb=0;for(let i=0;i<d.data.length;i+=4){rr+=d.data[i];gg+=d.data[i+1];bb+=d.data[i+2];}
    const n=d.data.length/4;return[Math.round(rr/n),Math.round(gg/n),Math.round(bb/n)];
  }
  // U/D face (top), F/B face (left), R/L face (right) — no rotation needed!
  const topFace=shot.faces[0], leftFace=shot.faces[1], rightFace=shot.faces[2];
  rawData[topFace]=g.uCenters.map(([x,y])=>sampleAt(x,y));
  rawData[leftFace]=g.fCenters.map(([x,y])=>sampleAt(x,y));
  rawData[rightFace]=g.rCenters.map(([x,y])=>sampleAt(x,y));

  // Show sampled colors preview
  const mg=document.getElementById('mgrid');mg.style.display='grid';
  const allRGB=[...rawData[topFace],...rawData[leftFace],...rawData[rightFace]];
  mg.style.gridTemplateColumns='repeat(9,1fr)';
  mg.innerHTML=allRGB.map(([r,g,b],i)=>'<div class="mcell" style="background:rgb('+r+','+g+','+b+')">'+(i%9===4?'⭐':'')+'</div>').join('');
  document.getElementById('info').textContent='✅ '+shot.label+' 完成！'+shot.faces.join('+')+' 各9格';
  if(cornerShotIdx<1){
    document.getElementById('btnRow').innerHTML='<button class="btn" onclick="nextCornerShot()">▶️ 翻轉拍第2面</button><button class="btn" style="margin-top:6px;background:rgba(255,255,255,.12);color:#ccc;font-size:12px;padding:8px 16px" onclick="retakeCornerShot()">🔄 重拍</button>';
  }else{
    document.getElementById('btnRow').innerHTML='<button class="btn" onclick="finishCornerScan()">🔍 分析顏色</button><button class="btn" style="margin-top:6px;background:rgba(255,255,255,.12);color:#ccc;font-size:12px;padding:8px 16px" onclick="retakeCornerShot()">🔄 重拍</button>';
  }
}

function finishCornerScan(){

function doClassifyCorner(){
  // Corner-shot samples need face remapping (staircase→box folding)
  // then standard smartDist + auction classification
  try{ doClassifyInnerCorner(); }catch(e){ showError('分析錯誤: '+e.message); }
}

function doClassifyInnerCorner(){
  // === NO ROTATION HERE ===
  // faceColors stores camera order. Rotation applied only at solve time.
  const rd={};
  ['U','R','F','D','L','B'].forEach(f=>{
    if(rawData[f])rd[f]=rawData[f].map(x=>x.slice?x.slice():[...x]);
  });

  const FO=['U','R','F','D','L','B'];const all=[];
  FO.forEach(f=>{const r=rd[f];if(!r)return;for(let i=0;i<9;i++)all.push({face:f,pos:i,rgb:r[i],color:null});});
  if(all.length!==54){showError('只有'+all.length+'個色塊');return;}

  // Build anchors from centers
  const anchors={};
  function _sat(r,g,b){const mx=Math.max(r,g,b);return mx>0?(mx-Math.min(r,g,b))/mx:0;}
  FO.forEach(f=>{
    if(f==='U'){
      // GAN logo fix: pick lowest-saturation among 4 offset samples
      const center=rd[f][4];
      const sat=_sat(...center);
      if(sat>0.3){
        // Center contaminated by logo, use fallback
        let bestSat=1,bestRGB=center;
        rd[f].forEach((rgb,i)=>{if(i===4)return;const s=_sat(...rgb);if(s<bestSat){bestSat=s;bestRGB=rgb;}});
        anchors[CC[f]]=bestRGB;
      }else{anchors[CC[f]]=center;}
    }else{anchors[CC[f]]=rd[f][4];}
  });
  all.forEach(s=>{if(s.pos===4)s.color=CC[s.face];});

  // smartDist + auction (same as doClassifyInner)
  const nonC=all.filter(s=>s.pos!==4);
  nonC.forEach(s=>{s.dists={};Object.entries(anchors).forEach(([c,[ar,ag,ab]])=>{const[r,g,b]=s.rgb;s.dists[c]=smartDist(r,g,b,ar,ag,ab,c);});});
  const quota={W:8,R:8,B:8,O:8,G:8,Y:8};
  nonC.forEach(s=>{let best=null,bestD=Infinity;Object.entries(s.dists).forEach(([c,d])=>{if(d<bestD){bestD=d;best=c;}});s.color=best;});
  for(let iter=0;iter<200;iter++){
    const cnt={W:0,R:0,B:0,O:0,G:0,Y:0};nonC.forEach(s=>cnt[s.color]++);
    const over=Object.keys(cnt).find(c=>cnt[c]>quota[c]);if(!over)break;
    const inOver=nonC.filter(s=>s.color===over);
    let bs=null,bc=Infinity;
    inOver.forEach(s=>{const curD=s.dists[over];Object.entries(s.dists).forEach(([c,d])=>{if(c===over||cnt[c]>=quota[c])return;const p=d-curD;if(p<bc){bc=p;bs={s,to:c};}});});
    if(bs)bs.s.color=bs.to;
    else{const under=Object.keys(cnt).find(c=>cnt[c]<quota[c]);if(!under)break;let b2=null,bD2=Infinity;inOver.forEach(s=>{if(s.dists[under]<bD2){bD2=s.dists[under];b2=s;}});if(b2)b2.color=under;else break;}
  }
  nonC.forEach(s=>{const sorted=Object.entries(s.dists).sort((a,b)=>a[1]-b[1]);s.sortedDists=sorted;s.bestDist=sorted[0][1];s.secondColor=sorted[1][0];s.secondDist=sorted[1][1];s.ambiguity=s.secondDist>0?(s.secondDist-s.bestDist)/s.secondDist:1;});
  FO.forEach(f=>{faceColors[f]=all.filter(s=>s.face===f).sort((a,b)=>a.pos-b.pos).map(s=>s.color);});

  // Show results on staircase diagram with drag-to-swap
  showStaircaseDiagram();
}

function showStaircaseDiagram(){
  // Build staircase layout: F-R / D-B / L-U (as seen in camera order)
  const STAIR=[
    {f:'F',label:'紅(F)',row:0,col:0},{f:'R',label:'藍(R)',row:0,col:1},
    {f:'D',label:'黃(D)',row:1,col:1},{f:'B',label:'橘(B)',row:1,col:2},
    {f:'L',label:'綠(L)',row:2,col:2},{f:'U',label:'白(U)',row:2,col:3}
  ];
  const cellSz=window.innerWidth<500?28:36;
  const gap=2;
  const faceSz=cellSz*3+gap*2;
  const faceGap=4;
  const totalW=(faceSz+faceGap)*4;
  const totalH=(faceSz+faceGap)*3+60;
  const mg=document.getElementById('mgrid');
  mg.style.display='block';
  mg.style.overflow='auto';
  let html='<div style="position:relative;width:'+totalW+'px;height:'+totalH+'px;margin:0 auto" id="staircaseWrap">';
  // Title
  html+='<div style="position:absolute;top:0;left:0;width:100%;text-align:center;font-size:13px;color:#FFD700">階梯圖（拖曳色塊交換位置）</div>';
  // Draw adjacency connectors (arrows between stair steps)
  const connectors=[
    {label:'左轉',x1:0,y1:0,x2:1,y2:0},
    {label:'上翻',x1:1,y1:0,x2:1,y2:1},
    {label:'左轉',x1:1,y1:1,x2:2,y2:1},
    {label:'上翻',x1:2,y1:1,x2:2,y2:2},
    {label:'左轉',x1:2,y1:2,x2:3,y2:2}
  ];
  STAIR.forEach(({f,label,row,col})=>{
    const ox=col*(faceSz+faceGap);
    const oy=row*(faceSz+faceGap)+24;
    // Face label
    html+='<div style="position:absolute;left:'+ox+'px;top:'+(oy-14)+'px;width:'+faceSz+'px;text-align:center;font-size:10px;color:rgba(255,255,255,.5)">'+label+'</div>';
    // 3x3 grid
    for(let r=0;r<3;r++)for(let c=0;c<3;c++){
      const idx=r*3+c;
      const color=faceColors[f][idx];
      const x=ox+c*(cellSz+gap);
      const y=oy+r*(cellSz+gap);
      const isCenter=idx===4;
      html+='<div class="stcell" data-face="'+f+'" data-pos="'+idx+'" draggable="'+(isCenter?'false':'true')+'" style="position:absolute;left:'+x+'px;top:'+y+'px;width:'+cellSz+'px;height:'+cellSz+'px;background:'+CMAP[color]+';border:1px solid rgba(0,0,0,.3);border-radius:3px;cursor:'+(isCenter?'default':'grab')+';display:flex;align-items:center;justify-content:center;font-size:9px;color:'+(color==='W'||color==='Y'?'#333':'#fff')+';user-select:none;'+(isCenter?'box-shadow:inset 0 0 0 2px #FFD700;':'')+'">'+CN[color]+'</div>';
    }
  });
  html+='</div>';
  mg.innerHTML=html;
  // Add drag-and-drop handlers
  initStaircaseDrag();
  // Show instruction + solve button
  document.getElementById('title').textContent='🎯 階梯確認';
  document.getElementById('sub').textContent='拖曳色塊交換位置，中心格固定';
  document.getElementById('info').innerHTML='<span style="color:#FFD700">請對照魔方確認每個色塊正確</span>';
  document.getElementById('btnRow').innerHTML='<button class="btn" onclick="doManualSolve()">✅ 確認後解題</button>';
}

function initStaircaseDrag(){
  let dragSrc=null;
  const wrap=document.getElementById('staircaseWrap');
  if(!wrap)return;
  wrap.addEventListener('dragstart',function(e){
    const el=e.target.closest('.stcell');
    if(!el||el.dataset.pos==='4')return;
    dragSrc=el;
    el.style.opacity='0.4';
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain','');
  });
  wrap.addEventListener('dragover',function(e){e.preventDefault();e.dataTransfer.dropEffect='move';});
  wrap.addEventListener('drop',function(e){
    e.preventDefault();
    const el=e.target.closest('.stcell');
    if(!el||!dragSrc||el===dragSrc)return;
    if(el.dataset.pos==='4'||dragSrc.dataset.pos==='4')return;
    // Swap colors
    const f1=dragSrc.dataset.face,p1=+dragSrc.dataset.pos;
    const f2=el.dataset.face,p2=+el.dataset.pos;
    const tmp=faceColors[f1][p1];
    faceColors[f1][p1]=faceColors[f2][p2];
    faceColors[f2][p2]=tmp;
    showStaircaseDiagram();
  });
  wrap.addEventListener('dragend',function(e){
    if(dragSrc)dragSrc.style.opacity='1';
    dragSrc=null;
  });
  // Touch support for mobile
  let touchSrc=null,touchClone=null;
  wrap.addEventListener('touchstart',function(e){
    const el=e.target.closest('.stcell');
    if(!el||el.dataset.pos==='4')return;
    touchSrc=el;
    // Create floating clone
    touchClone=el.cloneNode(true);
    touchClone.style.position='fixed';
    touchClone.style.zIndex='9999';
    touchClone.style.opacity='0.8';
    touchClone.style.pointerEvents='none';
    touchClone.style.transform='scale(1.2)';
    document.body.appendChild(touchClone);
    const t=e.touches[0];
    touchClone.style.left=(t.clientX-18)+'px';
    touchClone.style.top=(t.clientY-18)+'px';
    el.style.opacity='0.3';
  },{passive:true});
  wrap.addEventListener('touchmove',function(e){
    if(!touchClone)return;
    e.preventDefault();
    const t=e.touches[0];
    touchClone.style.left=(t.clientX-18)+'px';
    touchClone.style.top=(t.clientY-18)+'px';
  },{passive:false});
  wrap.addEventListener('touchend',function(e){
    if(!touchSrc){return;}
    if(touchClone){touchClone.remove();touchClone=null;}
    touchSrc.style.opacity='1';
    const t=e.changedTouches[0];
    const dropEl=document.elementFromPoint(t.clientX,t.clientY);
    const target=dropEl?dropEl.closest('.stcell'):null;
    if(target&&target!==touchSrc&&target.dataset.pos!=='4'){
      const f1=touchSrc.dataset.face,p1=+touchSrc.dataset.pos;
      const f2=target.dataset.face,p2=+target.dataset.pos;
      const tmp=faceColors[f1][p1];
      faceColors[f1][p1]=faceColors[f2][p2];
      faceColors[f2][p2]=tmp;
      showStaircaseDiagram();
    }
    touchSrc=null;
  });
}

function processGalleryImage(img,idx){
  // Draw image to canvas and sample 9 cells (same as doScanCapture)
  const tc=document.createElement('canvas');
  const vw=img.naturalWidth,vh=img.naturalHeight;
  tc.width=vw;tc.height=vh;
  const tctx=tc.getContext('2d');tctx.drawImage(img,0,0,vw,vh);
  const gs=Math.min(vw,vh)*0.68,cs=gs/3,sx=(vw-gs)/2,sy=(vh-gs)/2;
  let rgbs=[];
  const isUface=SCAN_SEQ[idx].f==='U';
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
    const px=Math.round(sx+(c+.5)*cs),py=Math.round(sy+(r+.5)*cs);
    const isCenter=(r===1&&c===1);
    if(isUface&&isCenter){
      // GAN logo avoidance: sample 4 offset points, pick the lowest-saturation one
      const off=Math.round(cs*0.4);
      const pts=[[px-off,py],[px+off,py],[px,py-off],[px,py+off]];
      let bestSat=Infinity,bestRGB=[200,200,200];
      pts.forEach(([ppx,ppy])=>{
        const d=tctx.getImageData(Math.max(0,ppx-3),Math.max(0,ppy-3),7,7);
        let rr=0,gg=0,bb=0;
        for(let i=0;i<d.data.length;i+=4){rr+=d.data[i];gg+=d.data[i+1];bb+=d.data[i+2];}
        const n=d.data.length/4;
        const pr=Math.round(rr/n),pg=Math.round(gg/n),pb=Math.round(bb/n);
        const mx=Math.max(pr,pg,pb),sat=mx>0?(mx-Math.min(pr,pg,pb))/mx:0;
        if(sat<bestSat){bestSat=sat;bestRGB=[pr,pg,pb];}
      });
      rgbs.push(bestRGB);
    } else {
      const sampleSize=Math.max(5,Math.round(cs*0.08));
      const half=Math.floor(sampleSize/2);
      const d=tctx.getImageData(Math.max(0,px-half),Math.max(0,py-half),sampleSize,sampleSize);
      let rr=0,gg=0,bb=0;
      for(let i=0;i<d.data.length;i+=4){rr+=d.data[i];gg+=d.data[i+1];bb+=d.data[i+2];}
      const n=d.data.length/4;rgbs.push([Math.round(rr/n),Math.round(gg/n),Math.round(bb/n)]);
    }
  }
  rawData[SCAN_SEQ[idx].f]=rgbs;
  // Show preview + image thumbnail
  const mg=document.getElementById('mgrid');mg.style.display='grid';
  mg.innerHTML=rgbs.map(([r,g,b],i)=>'<div class="mcell" style="background:rgb('+r+','+g+','+b+')">'+(i===4?'⭐':'')+'</div>').join('');
  // Show the uploaded image as background preview
  const wrap=document.querySelector('.wrap');
  wrap.style.backgroundImage='url('+img.src+')';
  wrap.style.backgroundSize='contain';
  wrap.style.backgroundPosition='center';
  wrap.style.backgroundRepeat='no-repeat';
  const info=SCAN_SEQ[idx];
  document.getElementById('info').textContent='✅ '+info.name+' 已處理 ('+rgbs.map(([r,g,b])=>'rgb('+r+','+g+','+b+')').join(' ')+')';
  // Show button to continue or re-upload
  document.getElementById('btnRow').innerHTML=
    '<button class="btn" onclick="galleryNext()">▶️ '+(idx<5?'下一面':'完成 — 分析顏色')+'</button>'+
    '<button class="btn btn-sm" style="margin-top:6px;background:rgba(255,255,255,.12);color:#ccc" onclick="galleryReplace('+idx+')">🔄 重新選擇此面</button>';
}
function galleryNext(){
  document.querySelector('.wrap').style.backgroundImage='';

}
function galleryReplace(idx){
  // Let user pick a single replacement image
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';

function drawGuideGrid(){
  if(!ov||!ov.width)return;
  const vw=ov.width,vh=ov.height;octx.clearRect(0,0,vw,vh);
  const gs=Math.min(vw,vh)*0.68,cs=gs/3,sx=(vw-gs)/2,sy=(vh-gs)/2;
  octx.fillStyle='rgba(0,0,0,.75)';
  octx.fillRect(0,0,vw,sy);octx.fillRect(0,sy+gs,vw,vh-sy-gs);octx.fillRect(0,sy,sx,gs);octx.fillRect(sx+gs,sy,vw-sx-gs,gs);
  octx.strokeStyle='rgba(255,215,0,.5)';octx.lineWidth=1.5;
  for(let i=0;i<=3;i++){octx.beginPath();octx.moveTo(sx+i*cs,sy);octx.lineTo(sx+i*cs,sy+gs);octx.stroke();octx.beginPath();octx.moveTo(sx,sy+i*cs);octx.lineTo(sx+gs,sy+i*cs);octx.stroke();}
  octx.strokeStyle='#FFD700';octx.lineWidth=3;
  [[sx,sy],[sx+gs,sy],[sx,sy+gs],[sx+gs,sy+gs]].forEach(([x,y])=>{const dx=x===sx?1:-1,dy=y===sy?1:-1;octx.beginPath();octx.moveTo(x+14*dx,y);octx.lineTo(x,y);octx.lineTo(x,y+14*dy);octx.stroke();});
}
function doScanCapture(){
  if(!vid.videoWidth)return;
  const vw=vid.videoWidth,vh=vid.videoHeight,tc=document.createElement('canvas');tc.width=vw;tc.height=vh;
  const tctx=tc.getContext('2d');tctx.drawImage(vid,0,0,vw,vh);
  // Shrunk from 82% to 68% — avoids fingers/edges being sampled
  const gs=Math.min(vw,vh)*0.68,cs=gs/3,sx=(vw-gs)/2,sy=(vh-gs)/2;
  let rgbs=[];
  const isUface=SCAN_SEQ[scanIdx].f==='U';
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
    const px=Math.round(sx+(c+.5)*cs),py=Math.round(sy+(r+.5)*cs);
    const isCenter=(r===1&&c===1);
    if(isUface&&isCenter){
      // GAN logo avoidance: sample 4 offset points, pick the lowest-saturation one
      const off=Math.round(cs*0.4);
      const pts=[[px-off,py],[px+off,py],[px,py-off],[px,py+off]];
      let bestSat=Infinity,bestRGB=[200,200,200];
      pts.forEach(([ppx,ppy])=>{
        const d=tctx.getImageData(ppx-3,ppy-3,7,7);
        let rr=0,gg=0,bb=0;
        for(let i=0;i<d.data.length;i+=4){rr+=d.data[i];gg+=d.data[i+1];bb+=d.data[i+2];}
        const n=d.data.length/4;
        const pr=Math.round(rr/n),pg=Math.round(gg/n),pb=Math.round(bb/n);
        const mx=Math.max(pr,pg,pb),sat=mx>0?(mx-Math.min(pr,pg,pb))/mx:0;
        if(sat<bestSat){bestSat=sat;bestRGB=[pr,pg,pb];}
      });
      rgbs.push(bestRGB);
    } else {
      const d=tctx.getImageData(px-5,py-5,11,11);let rr=0,gg=0,bb=0;
      for(let i=0;i<d.data.length;i+=4){rr+=d.data[i];gg+=d.data[i+1];bb+=d.data[i+2];}
      const n=d.data.length/4;rgbs.push([Math.round(rr/n),Math.round(gg/n),Math.round(bb/n)]);
    }
  }
  // Check for occluded/bad pixels (too dark = finger/shadow)
  let badCells=[];
  rgbs.forEach(([r,g,b],i)=>{
    const v=Math.max(r,g,b)/255;
    if(v<0.25)badCells.push(i);
  });
  if(badCells.length>0){
    // Warn but still save — user can retake
    if(navigator.vibrate)navigator.vibrate([100,50,100]);
    const mg=document.getElementById('mgrid');mg.style.display='grid';
    mg.innerHTML=rgbs.map(([r,g,b],i)=>{
      const bad=badCells.includes(i);
      return '<div class="mcell" style="background:rgb('+r+','+g+','+b+')">'+(bad?'❌':(i===4?'⭐':''))+'</div>';
    }).join('');
    document.getElementById('info').innerHTML='<span style="color:#E94560">⚠️ '+badCells.length+'格被遮擋（太暗），請重新對齊拍照</span>';
    document.getElementById('btnRow').innerHTML='<button class="btn" onclick="retakeCurrent()">🔄 重拍此面</button><button class="btn btn-sm" style="margin-top:6px;background:rgba(255,255,255,.12);color:#ccc" onclick="acceptAndContinue()">仍要繼續</button>';
    // Store temporarily — retake will overwrite
    rawData[SCAN_SEQ[scanIdx].f]=rgbs;
    return;
  }
  rawData[SCAN_SEQ[scanIdx].f]=rgbs;
  if(navigator.vibrate)navigator.vibrate(80);
  const mg=document.getElementById('mgrid');mg.style.display='grid';
  mg.innerHTML=rgbs.map(([r,g,b],i)=>'<div class="mcell" style="background:rgb('+r+','+g+','+b+')">'+(i===4?'⭐':'')+'</div>').join('');
  scanIdx++;
  if(scanIdx>=SCAN_SEQ.length){
    document.getElementById('title').textContent='✅ 6面拍攝完成！';
    document.getElementById('sub').textContent='按下方按鈕分析顏色';
    document.getElementById('info').textContent='';
    document.getElementById('btnRow').innerHTML='<button class="btn" onclick="doClassify()">🔍 分析顏色</button>';
  }else{
    const next=SCAN_SEQ[scanIdx];
    document.getElementById('title').textContent='下一面：'+next.name;
    document.getElementById('sub').textContent=next.guide;
    document.getElementById('dots').innerHTML=SCAN_SEQ.map((_,i)=>'<div class="td'+(i<scanIdx?' done':'')+(i===scanIdx?' now':'')+'"></div>').join('');
    document.getElementById('info').textContent='✅ 已拍 '+scanIdx+'/6，轉好後按拍照';
    document.getElementById('btnRow').innerHTML='<button class="btn" onclick="doScanCapture()">📸 拍照</button>';
  }
}

function cycleColor(face,pos){const colors=['W','R','B','O','G','Y'];const cur=faceColors[face][pos];faceColors[face][pos]=colors[(colors.indexOf(cur)+1)%6];showEditableFaces();}
function doManualSolve(){
  // Validate: each color must appear exactly 9 times
  const cnt={};['U','R','F','D','L','B'].forEach(f=>faceColors[f].forEach(c=>{cnt[c]=(cnt[c]||0)+1;}));
  const ok=Object.values(cnt).every(v=>v===9)&&Object.keys(cnt).length===6;
  if(!ok){showError('每個顏色必須剛好 9 個！目前: '+Object.entries(cnt).map(([c,n])=>CN[c]+':'+n).join(' '));return;}
  // Apply rotation: faceColors is camera order → convert to standard positions for solver
  applyFaceRotation();
  doLBLSolve();
}

function applyFaceRotation(){
  // Staircase fold geometry proof: D, B, L all need rot90CW
  // F, R, U = identity. This is definitive math, not empirical.
  function rot90CW(a){return[a[6],a[3],a[0],a[7],a[4],a[1],a[8],a[5],a[2]];}
  faceColors.D=rot90CW(faceColors.D);
  faceColors.B=rot90CW(faceColors.B);
  faceColors.L=rot90CW(faceColors.L);
}

function doClassify(){try{doClassifyInner();}catch(e){showError('分析錯誤: '+e.message);}}
function doClassifyInner(){
  // === NO ROTATION HERE ===
  // faceColors stores camera order (what the photo shows).
  // Rotation (D=CW, B=CCW, L=CCW) is applied only at solve time.
  const rd={};
  ['U','R','F','D','L','B'].forEach(f=>{if(rawData[f])rd[f]=rawData[f].map(x=>x.slice?x.slice():[...x]);});

  const FO=['U','R','F','D','L','B'];const all=[];
  FO.forEach(f=>{const r=rd[f];if(!r)return;for(let i=0;i<9;i++)all.push({face:f,pos:i,rgb:r[i],color:null});});
  if(all.length!==54){showError('只有'+all.length+'個色塊');return;}

  // Build anchors. GAN logo fix: if U center pixel is too saturated or too dark
  // (logo covers center), find the best white reference from U face's other stickers.
  const anchors={};
  function _sat(r,g,b){const mx=Math.max(r,g,b);return mx>0?(mx-Math.min(r,g,b))/mx:0;}
  FO.forEach(f=>{
    if(f==='U'){
      const c=rawData[f][4];
      const sat=_sat(c[0],c[1],c[2]);
      const bright=Math.max(c[0],c[1],c[2])/255;
      if(sat>0.15||bright<0.5){
        // Center is corrupted by logo — scan ALL 8 non-center U stickers,
        // pick the one with lowest saturation + highest brightness as white ref.
        let bestIdx=-1,bestScore=Infinity;
        for(let i=0;i<9;i++){
          if(i===4)continue;
          const[r,g,b]=rawData[f][i];
          const s=_sat(r,g,b), v=Math.max(r,g,b)/255;
          const score=s*5+(1-v)*3; // low sat + high brightness = best white
          if(score<bestScore){bestScore=score;bestIdx=i;}
        }
        if(bestIdx>=0){
          anchors['W']=rawData[f][bestIdx];
        } else {
          // Fallback: synthesize neutral white at high brightness
          anchors['W']=[210,210,210];
        }
      } else {
        anchors['W']=c;
      }
    } else anchors[CC[f]]=rawData[f][4];
  });
  all.forEach(s=>{if(s.pos===4)s.color=CC[s.face];});

  function toHSV(r,g,b){
    const rf=r/255,gf=g/255,bf=b/255,mx=Math.max(rf,gf,bf),mn=Math.min(rf,gf,bf),d=mx-mn;
    const v=mx,s=mx>0?d/mx:0;let h=0;
    if(d>0.001){if(mx===rf)h=60*(((gf-bf)/d)%6);else if(mx===gf)h=60*((bf-rf)/d+2);else h=60*((rf-gf)/d+4);if(h<0)h+=360;}
    return[h,s,v];
  }
  function smartDist(r,g,b,ar,ag,ab,c){
    const[h,s,v]=toHSV(r,g,b);const[ah,as,av]=toHSV(ar,ag,ab);
    // White: low saturation = good match; high saturation = very high penalty
    if(c==='W'){
      if(s<0.20)return(1-v)*3+s*10;
      return 30+s*100;
    }
    // Chromatic anchor but sticker is near-white: high penalty
    if(s<0.15)return 30+((0.15-s)/0.15)*20;
    // Hue distance
    let hd=Math.abs(h-ah);hd=Math.min(hd,360-hd);
    // R/O zone: both sticker AND anchor hue in red-orange range (H>300 or H<45)
    // Use G-B difference as primary discriminator (best for R vs O)
    const stickerRO=(h>300||h<45);
    const anchorRO=(ah>300||ah<45);
    if(stickerRO&&anchorRO){
      const gb=g-b, agb=ag-ab;
      return Math.abs(gb-agb)*1.5+Math.abs(v-av)*30+hd*0.3;
    }
    // Zone mismatch penalty: warm sticker (R/O) vs non-warm anchor (Y/G/B)
    // General formula for everything else (Y, G, B, and cross-zone comparisons)
    let dist=hd+Math.abs(v-av)*30+Math.abs(s-as)*10;
    // Warm sticker (H<45, in R/O zone) vs Y anchor: add penalty
    // Orange H≈20 should NOT be close to Yellow H≈60
    if(c==='Y'&&(h<45&&!(h>300))){dist+=(45-h)*2;}
    return dist;
  }

  const nonC=all.filter(s=>s.pos!==4);
  nonC.forEach(s=>{s.dists={};Object.entries(anchors).forEach(([c,[ar,ag,ab]])=>{const[r,g,b]=s.rgb;s.dists[c]=smartDist(r,g,b,ar,ag,ab,c);});});

  // === OPTIMAL ASSIGNMENT (min-cost with quota constraints) ===
  // Each color needs exactly 8 more stickers (9 total minus center).
  // Use iterative auction: assign each sticker to its best available color,
  // then resolve over-allocated colors by bumping highest-cost stickers.
  const quota={W:8,R:8,B:8,O:8,G:8,Y:8};
  // Initial assignment: each sticker gets its best color
  nonC.forEach(s=>{
    let best=null,bestD=Infinity;
    Object.entries(s.dists).forEach(([c,d])=>{if(d<bestD){bestD=d;best=c;}});
    s.color=best;
  });
  // Iteratively fix over-quota colors by bumping worst-fit stickers to their next-best
  for(let iter=0;iter<200;iter++){
    const cnt={W:0,R:0,B:0,O:0,G:0,Y:0};
    nonC.forEach(s=>cnt[s.color]++);
    // Find an over-quota color
    const over=Object.keys(cnt).find(c=>cnt[c]>quota[c]);
    if(!over)break; // all balanced
    // Among stickers assigned to 'over', find the one with smallest penalty to switch
    const inOver=nonC.filter(s=>s.color===over);
    let bestSwitch=null,bestCost=Infinity;
    inOver.forEach(s=>{
      const curD=s.dists[over];
      Object.entries(s.dists).forEach(([c,d])=>{
        if(c===over)return;
        if(cnt[c]>=quota[c])return; // target also full
        const penalty=d-curD; // cost increase of switching
        if(penalty<bestCost){bestCost=penalty;bestSwitch={s,from:over,to:c};}
      });
    });
    if(!bestSwitch){
      // No direct switch possible; find any under-quota color and force
      const under=Object.keys(cnt).find(c=>cnt[c]<quota[c]);
      if(!under)break;
      // Pick the sticker in 'over' with smallest distance to 'under'
      let best2=null,bestD2=Infinity;
      inOver.forEach(s=>{if(s.dists[under]<bestD2){bestD2=s.dists[under];best2=s;}});
      if(best2){best2.color=under;}else break;
    }else{
      bestSwitch.s.color=bestSwitch.to;
    }
  }
  nonC.forEach(s=>{const sorted=Object.entries(s.dists).sort((a,b)=>a[1]-b[1]);s.sortedDists=sorted;s.bestDist=sorted[0][1];s.secondColor=sorted[1][0];s.secondDist=sorted[1][1];s.ambiguity=s.secondDist>0?(s.secondDist-s.bestDist)/s.secondDist:1;});
  FO.forEach(f=>{faceColors[f]=all.filter(s=>s.face===f).sort((a,b)=>a.pos-b.pos).map(s=>s.color);});

  // === VALIDITY CHECK + AUTO-FIX ===
  // faceColors = camera order. Build rotated copy for standard-position diagnostics.
  // Fold geometry proof: D, B, L all need rot90CW. F, R, U = identity.
  function _foldCW(a){return[a[6],a[3],a[0],a[7],a[4],a[1],a[8],a[5],a[2]];}
  const sFC={};['U','R','F','D','L','B'].forEach(f=>{sFC[f]=faceColors[f].slice();});
  sFC.D=_foldCW(sFC.D);sFC.B=_foldCW(sFC.B);sFC.L=_foldCW(sFC.L);

  const OPPOSITE={W:'Y',Y:'W',R:'O',O:'R',B:'G',G:'B'};
  function isInvalidPiece(cols){for(let i=0;i<cols.length;i++)for(let j=i+1;j<cols.length;j++)if(cols[i]===cols[j]||OPPOSITE[cols[i]]===cols[j])return true;return false;}
  const EDGE_POS=[['U',7,'F',1],['U',5,'R',1],['U',1,'B',1],['U',3,'L',1],['F',5,'R',3],['F',3,'L',5],['B',3,'R',5],['B',5,'L',3],['D',1,'F',7],['D',5,'R',7],['D',7,'B',7],['D',3,'L',7]];
  const CORNER_POS=[['U',8,'F',2,'R',0],['U',6,'F',0,'L',2],['U',0,'B',2,'L',0],['U',2,'B',0,'R',2],['D',2,'F',8,'R',6],['D',0,'F',6,'L',8],['D',6,'B',8,'L',6],['D',8,'B',6,'R',8]];
  function getInvalidPieces(){
    const bad=[];
    EDGE_POS.forEach(([f1,p1,f2,p2],idx)=>{if(isInvalidPiece([sFC[f1][p1],sFC[f2][p2]]))bad.push({type:'edge',idx,positions:[[f1,p1],[f2,p2]]});});
    CORNER_POS.forEach(([f1,p1,f2,p2,f3,p3],idx)=>{if(isInvalidPiece([sFC[f1][p1],sFC[f2][p2],sFC[f3][p3]]))bad.push({type:'corner',idx,positions:[[f1,p1],[f2,p2],[f3,p3]]});});
    return bad;
  }
  // Fix by count-balanced swaps between opposite-color pairs
  function tryAutoFix(maxIter){
    for(let iter=0;iter<maxIter;iter++){
      const bad=getInvalidPieces();if(bad.length===0)return true;
      const badStickers=[];
      bad.forEach(b=>b.positions.forEach(([f,p])=>{if(p!==4){const s=nonC.find(x=>x.face===f&&x.pos===p);if(s&&!badStickers.includes(s))badStickers.push(s);}}));
      badStickers.sort((a,b)=>a.ambiguity-b.ambiguity);
      let fixed=false;
      for(const bs of badStickers){
        const cur=bs.color;
        for(let ci=0;ci<bs.sortedDists.length;ci++){
          const alt=bs.sortedDists[ci][0];if(alt===cur)continue;
          const swaps=nonC.filter(s=>s!==bs&&s.color===alt&&s.pos!==4).sort((a,b)=>a.dists[cur]-b.dists[cur]);
          for(const sc of swaps){
            bs.color=alt;sc.color=cur;faceColors[bs.face][bs.pos]=alt;faceColors[sc.face][sc.pos]=cur;
            if(getInvalidPieces().length<bad.length){fixed=true;break;}
            bs.color=cur;sc.color=alt;faceColors[bs.face][bs.pos]=cur;faceColors[sc.face][sc.pos]=alt;
          }
          if(fixed)break;
        }
        if(fixed)break;
      }

  }
  function tryBruteFix(){
    const bad=getInvalidPieces();if(bad.length===0)return true;
    const pairs=[['R','O'],['W','Y'],['B','G']];
    for(const[cA,cB]of pairs){
      const gA=nonC.filter(s=>s.color===cA&&s.pos!==4).sort((a,b)=>a.dists[cB]-b.dists[cB]);
      const gB=nonC.filter(s=>s.color===cB&&s.pos!==4).sort((a,b)=>a.dists[cA]-b.dists[cA]);
      for(let i=0;i<Math.min(gA.length,4);i++){
        for(let j=0;j<Math.min(gB.length,4);j++){
          const sa=gA[i],sb=gB[j];
          sa.color=cB;sb.color=cA;faceColors[sa.face][sa.pos]=cB;faceColors[sb.face][sb.pos]=cA;
          if(getInvalidPieces().length<bad.length){if(tryAutoFix(10))return true;if(getInvalidPieces().length<bad.length)return tryBruteFix();}
          sa.color=cA;sb.color=cB;faceColors[sa.face][sa.pos]=cA;faceColors[sb.face][sb.pos]=cB;
        }
      }
    }
    return false;
  }
  let autoFixed=tryAutoFix(20);
  if(!autoFixed)autoFixed=tryBruteFix();

  // === BUILD DEBUG INFO ===
  const dbg=[];
  dbg.push('🔦 補光燈: '+(window._torchOn?'ON':'OFF'));
  dbg.push('');
  // Anchors
  dbg.push('=== 錨點 (中心色 RGB) ===');
  const anchorNames={W:'白',R:'紅',B:'藍',O:'橘',G:'綠',Y:'黃'};
  Object.entries(anchors).forEach(([c,[r,g,b]])=>{
    const[h,s,v]=toHSV(r,g,b);
    dbg.push(anchorNames[c]+' '+c+': rgb('+r+','+g+','+b+') H='+h.toFixed(0)+' S='+s.toFixed(2)+' V='+v.toFixed(2));
  });
  dbg.push('');
  // Per-face sticker details
  dbg.push('=== 54 色塊 RGB → 分類 ===');
  FO.forEach(f=>{
    dbg.push('--- '+FLABEL[f]+' ('+f+') ---');
    const posNames=['左上','上','右上','左','中','右','左下','下','右下'];
    for(let i=0;i<9;i++){
      const s=all.find(x=>x.face===f&&x.pos===i);
      const[r,g,b]=s.rgb;
      const[h,sat,v]=toHSV(r,g,b);
      let line=posNames[i]+' ['+i+']: rgb('+r+','+g+','+b+') H='+h.toFixed(0)+' S='+sat.toFixed(2)+' V='+v.toFixed(2);
      line+=' → '+CN[s.color]+' ('+s.color+')';
      if(i!==4 && s.sortedDists){
        const top3=s.sortedDists.slice(0,3).map(([c,d])=>c+'='+d.toFixed(1)).join(' ');
        line+=' ['+top3+']';
        if(s.ambiguity<0.3) line+=' ⚠️模糊!';
      }
      dbg.push(line);
    }
  });
  dbg.push('');
  // Count
  const cntFinal={W:0,R:0,B:0,O:0,G:0,Y:0};
  all.forEach(s=>cntFinal[s.color]++);
  dbg.push('=== 顏色計數 ===');
  dbg.push(Object.entries(cntFinal).map(([c,n])=>CN[c]+'('+c+')='+n).join(' '));
  dbg.push('');
  // Invalid pieces
  const bp=getInvalidPieces();
  dbg.push('=== 不合法色塊組合: '+bp.length+'個 ===');
  bp.forEach(b=>{
    const cols=b.positions.map(([f,p])=>sFC[f][p]);
    const locs=b.positions.map(([f,p])=>f+'['+p+']').join('+');
    dbg.push(b.type+' '+locs+': '+cols.map(c=>CN[c]).join('-')+' ('+cols.join('-')+')');
  });
  dbg.push('');
  // Auto-fix log
  dbg.push('=== 自動修正 ===');
  dbg.push('tryAutoFix: '+(autoFixed?'✅ 成功':'❌ 失敗'));

  // === PARITY & PIECE DIAGNOSTICS ===
  dbg.push('');
  dbg.push('=== 拓撲診斷 ===');
  // Edge pieces
  const edgePieces=EDGE_POS.map(([f1,p1,f2,p2])=>[sFC[f1][p1],sFC[f2][p2]]);
  const edgeSorted=edgePieces.map(e=>[...e].sort().join(''));
  const edgeUniq=new Set(edgeSorted);
  const edgeDup=edgeSorted.filter((e,i)=>edgeSorted.indexOf(e)!==i);
  dbg.push('邊塊: '+edgeUniq.size+'/12 不重複'+(edgeUniq.size===12?' ✅':' ❌'));
  if(edgeDup.length>0)dbg.push('  重複邊塊: '+[...new Set(edgeDup)].join(', '));
  // Corner pieces
  const cornerPieces=CORNER_POS.map(([f1,p1,f2,p2,f3,p3])=>[sFC[f1][p1],sFC[f2][p2],sFC[f3][p3]]);
  const cornerSorted=cornerPieces.map(c=>[...c].sort().join(''));
  const cornerUniq=new Set(cornerSorted);
  const cornerDup=cornerSorted.filter((c,i)=>cornerSorted.indexOf(c)!==i);
  dbg.push('角塊: '+cornerUniq.size+'/8 不重複'+(cornerUniq.size===8?' ✅':' ❌'));
  if(cornerDup.length>0)dbg.push('  重複角塊: '+[...new Set(cornerDup)].join(', '));
  // Missing standard pieces
  const colors6=['W','R','B','O','G','Y'];const opp2={W:'Y',Y:'W',R:'O',O:'R',B:'G',G:'B'};
  const legalEdgeSet=new Set();
  for(let i=0;i<6;i++)for(let j=i+1;j<6;j++){if(opp2[colors6[i]]!==colors6[j])legalEdgeSet.add([colors6[i],colors6[j]].sort().join(''));}
  const legalCornerSet=new Set();
  for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)for(let k=j+1;k<6;k++){const a=colors6[i],b=colors6[j],c=colors6[k];if(opp2[a]!==b&&opp2[a]!==c&&opp2[b]!==c)legalCornerSet.add([a,b,c].sort().join(''));}
  const missingE=[...legalEdgeSet].filter(e=>!edgeSorted.includes(e));
  const extraE=[...edgeUniq].filter(e=>!legalEdgeSet.has(e));
  if(missingE.length>0)dbg.push('  缺少邊塊: '+missingE.join(', '));

_lbl.solveStage4=function(state) {

    var target = (current === 0) ? 1 : (current === 1) ? 2 : 4;
    
    var found = false;

      var t = _lbl.clone(state);

_lbl.solveStage1=function(state) {

        var cf=(function(u,f,c){return function(st){return _lbl.crossEdgeOK(st,u,f,c);};})(ct.u,ct.f,ct.c);

_lbl.E_KICKOUT={"FR":[["R'","D","R"],["F","D'","F'"]],"FL":[["L","D'","L'"],["F'","D","F"]],"BR":[["R","D'","R'"],["B'","D","B"]],"BL":[["L'","D","L"],["B","D'","B'"]]};
_lbl.U_KICKOUT={"UF":["F2"],"UR":["R2"],"UB":["B2"],"UL":["L2"]};

function optimizeMoves(mvs){
  let arr=[...mvs];
  let changed=true;
  while(changed){
    changed=false;
    for(let i=0;i<arr.length-1;i++){
      const a=arr[i],b=arr[i+1];
      if(a[0]!==b[0])continue; // different face
      const face=a[0];
      // Convert to quarter turns: X=1, X'=-1, X2=2
      function toQ(m){if(m.includes('2'))return 2;if(m.includes("'"))return -1;return 1;}
      function fromQ(f,q){q=((q%4)+4)%4;if(q===0)return null;if(q===1)return f;if(q===2)return f+'2';return f+"'";}

      const sum=(qa+qb)%4;
      const merged=fromQ(face,sum);
      if(merged===null){
        arr.splice(i,2); // cancel out
      }else{
        arr.splice(i,2,merged); // merge
      }
      changed=true;
      break;
    }
  }
  return arr;
}

var SLOT_MAP = {

function mapFormula(frMoves, slot) {

var F2L_PAIRS = [

function isPairSolved(st, p) {

function allIntact(st, solvedSlots) {

// === Smart Joint-Extraction ===
function getSafeKickouts(targetSlot, solvedSlots) {
  var safe = ['FR','FL','BR','BL'].filter(function(s) {
    return solvedSlots.indexOf(s) < 0 || s === targetSlot;
  });
  var kicks = [];
  safe.forEach(function(sl) {
    if(sl==='FR'){kicks.push(["R'","D","R"],["R'","D'","R"],["R'","D2","R"],["F","D","F'"],["F","D'","F'"],["F","D2","F'"]);}
    if(sl==='FL'){kicks.push(["L","D","L'"],["L","D'","L'"],["L","D2","L'"],["F'","D","F"],["F'","D'","F"],["F'","D2","F"]);}

function smartExtract(state, pair, solvedSlots) {
  var cc = pair.corner, ee = pair.edge;
  function bothInD(st) {
    var c = _lbl.findCorner(st, cc[0], cc[1], cc[2]);
    var e = _lbl.findEdge(st, ee[0], ee[1]);
    return c && e && c.layer === 'D' && e.layer === 'D';
  }
  if (bothInD(state)) return [];
  var kicks = getSafeKickouts(pair.slot, solvedSlots);
  // Depth 1
  for (var i = 0; i < kicks.length; i++) {
    var t = _lbl.clone(state); _lbl.dms(t, kicks[i]);
    if (bothInD(t) && allIntact(t, solvedSlots)) return kicks[i];
  }
  // Depth 2
  for (var i2 = 0; i2 < kicks.length; i2++) {
    var t1 = _lbl.clone(state); _lbl.dms(t1, kicks[i2]);

// === CFOP F2L Main: Full-search kickout × D-prefix × formula ===
_lbl.solveCFOPF2L = function(state) {

        allKicks.push(kicks[k2].concat(kicks[k3]));

          }

    }

      steps.push({explain:'F2L【'+pair.name+'】('+bestMoves.length+'步)',moves:bestMoves});

    }

    var mid=_lbl.MID.find(function(m){return m.n===pair.name;});
    if(mid){for(var a3=0;a3<8;a3++){if(_lbl.edgeOK(state,mid))break;var e2=_lbl.findEdge(state,mid.c1,mid.c2);if(!e2)break;if(e2.layer==='E'){var kf=_lbl.F2L_FORMULAS[e2.slot];if(kf){_lbl.dms(state,kf.right);steps.push({explain:'LBL邊塊踢出',moves:kf.right});}continue;}if(e2.layer==='D'){var cs=[];for(var k=0;k<_lbl.MID.length;k++){if(_lbl.MID[k].n!==pair.name&&_lbl.edgeOK(state,_lbl.MID[k]))cs.push(_lbl.MID[k]);}var sol=_lbl.findF2LInsert(state,mid,cs);if(sol){if(sol.setup.length>0){_lbl.dms(state,sol.setup);steps.push({explain:'LBL對齊',moves:sol.setup});}_lbl.dms(state,sol.formula);steps.push({explain:'LBL插入',moves:sol.formula});}break;}}}
    if(isPairSolved(state,pair))solvedSlots.push(pair.slot);
  }

// === CFOP Engine v2 ===
_lbl.cfopEngine = function(init) {
  var s = _lbl.clone(init), script = [], mc = 0;
  function recOnly(stage, explain, moves) {
    if (!moves || !moves.length) return;
    script.push({stage: stage, explain: explain, moves: moves}); mc += moves.length;
  }
  var r1 = _lbl.solveCrossIDDFS(s); if (r1) r1.steps.forEach(function(st) { recOnly('Cross', st.explain, st.moves); });
  var rF = _lbl.solveCFOPF2L(s); if (rF) rF.steps.forEach(function(st) { recOnly('F2L', st.explain, st.moves); });
  var r4 = _lbl.solveStage4(s); if (r4) r4.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); });
  var r5 = _lbl.solveStage5(s); if (r5 && r5.moves.length > 0) { _lbl.dms(s, r5.moves); r5.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); }); }
  var r6 = _lbl.solveStage6(s); if (r6) r6.steps.forEach(function(st) { recOnly('PLL', st.explain, st.moves); });
  var r7 = _lbl.solveStage7(s); if (r7) r7.steps.forEach(function(st) { if (st.moves.length > 0) recOnly('PLL', st.explain, st.moves); });
  return { script: script, mc: mc, state: s };
};

function dFaceAllYellow(st) {

         st.D[4]==='Y'&&st.D[5]==='Y'&&st.D[6]==='Y'&&st.D[7]==='Y'&&st.D[8]==='Y';
}

_lbl.solveOCLL = function(state) {

  for (var d1=0;d1<4;d1++) for (var f1=0;f1<OCLL_FORMULAS.length;f1++) {

    return st[f][6]===st[f][4]&&st[f][7]===st[f][4]&&st[f][8]===st[f][4];
  });
}

_lbl.solve2LookPLL = function(state) {
  var steps=[], dS=[[], ['D'], ['D2'], ["D'"]];
  
  // CP: forward-check T-perm × 4 D-setups
  if (!cornersOK(state)) {
    var cpDone = false;
    // Single T-perm
    for (var di=0;di<4&&!cpDone;di++) {
      var mv=dS[di].concat(TPERM);
      var ts=_lbl.clone(state);_lbl.dms(ts,mv);
      for(var adj=0;adj<4;adj++){if(cornersOK(ts)){
        var full=mv.slice();for(var a2=0;a2<adj;a2++)full.push('D');
        steps.push({explain:'PLL角塊排列',moves:full});_lbl.dms(state,full);cpDone=true;break;}
        _lbl.dm(ts,'D');
      }
    }
    // Double T-perm
    if (!cpDone) {
      for(var d1=0;d1<4&&!cpDone;d1++) for(var d2=0;d2<4&&!cpDone;d2++){
        var m2=dS[d1].concat(TPERM).concat(dS[d2]).concat(TPERM);
        var ts2=_lbl.clone(state);_lbl.dms(ts2,m2);
        for(var adj2=0;adj2<4;adj2++){if(cornersOK(ts2)){
          for(var a3=0;a3<adj2;a3++)m2.push('D');
          steps.push({explain:'PLL角塊排列(雙T)',moves:m2});_lbl.dms(state,m2);cpDone=true;break;}
          _lbl.dm(ts2,'D');
        }
      }
    }
  }
  
  // EP: forward-check 4 formulas × 4 D-setups
  if (!allBottomOK(state)) {
    var epDone = false;
    for(var di2=0;di2<4&&!epDone;di2++) for(var fi=0;fi<EP_FORMULAS.length&&!epDone;fi++){
      var mv3=dS[di2].concat(EP_FORMULAS[fi]);
      var ts3=_lbl.clone(state);_lbl.dms(ts3,mv3);
      for(var adj3=0;adj3<4;adj3++){if(allBottomOK(ts3)){
        for(var a4=0;a4<adj3;a4++)mv3.push('D');
        steps.push({explain:'PLL邊塊排列',moves:mv3});_lbl.dms(state,mv3);epDone=true;break;}
        _lbl.dm(ts3,'D');
      }
    }
  }
  
  // Final D-adjust
  for(var fd=0;fd<4;fd++){
    if(allBottomOK(state))break;
    _lbl.dm(state,'D');steps.push({explain:'最終對齊',moves:['D']});
  }
  
  return{steps:steps};
};

// ================================================================
// Override cfopEngine to use OCLL + 2-Look PLL
// ================================================================
_lbl.cfopEngine = function(init) {
  var s = _lbl.clone(init), script = [], mc = 0;
  function recOnly(stage, explain, moves) {
    if (!moves || !moves.length) return;
    var opt=optimizeMoves(moves);if(!opt.length)return;script.push({stage:stage,explain:explain,moves:opt});mc+=opt.length;
  }

  // Cross (IDDFS)
  var r1 = _lbl.solveCrossIDDFS(s);
  if (r1) r1.steps.forEach(function(st) { recOnly('Cross', st.explain, st.moves); });

  // F2L v2 (Smart Extract + Translated Formulas)
  var rF = _lbl.solveCFOPF2L(s);
  if (rF) rF.steps.forEach(function(st) { recOnly('F2L', st.explain, st.moves); });

  // OLL Step 1: Yellow cross (S4)
  var r4 = _lbl.solveStage4(s);
  if (r4) r4.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); });

  // OLL Step 2: Corner orientation (OCLL)
  var rOCLL = _lbl.solveOCLL(s);
  if (rOCLL) rOCLL.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); });

  // PLL: 2-Look (CP + EP)
  var rPLL = _lbl.solve1LookPLL(s);
  if (rPLL) rPLL.steps.forEach(function(st) { recOnly('PLL', st.explain, st.moves); });

  // Peephole: optimize across stage boundaries (D D' → [], R R' → [], etc.)
  var allM=[],bounds=[];
  script.forEach(function(st){bounds.push({stage:st.stage,explain:st.explain,start:allM.length});allM=allM.concat(st.moves);bounds[bounds.length-1].end=allM.length;});
  var opt=optimizeMoves(allM);
  // Rebuild script with optimized moves
  if(opt.length<allM.length){
    var newScript=[],pos=0;
    for(var bi=0;bi<bounds.length;bi++){
      var b=bounds[bi];
      var origLen=b.end-b.start;
      var ratio=origLen/Math.max(allM.length,1);
      var newEnd=Math.min(Math.round(pos+ratio*opt.length),opt.length);
      if(bi===bounds.length-1)newEnd=opt.length;
      var chunk=opt.slice(pos,newEnd);
      if(chunk.length>0)newScript.push({stage:b.stage,explain:b.explain,moves:chunk});
      pos=newEnd;
    }
    script=newScript;
  }
  mc=opt.length;

  return { script: script, mc: mc, state: s };
};

// ================================================================
// CFOP Cross: In-place IDDFS (保證 8 步以內，平均 ~6 步)
// ================================================================
_lbl.solveCrossIDDFS = function(initState) {
  var MOVES = ['U',"U'","U2",'D',"D'","D2",'R',"R'","R2",'L',"L'","L2",'F',"F'","F2",'B',"B'","B2"];
  var UNDOS = ["U'",'U',"U2","D'",'D',"D2","R'",'R',"R2","L'",'L',"L2","F'",'F',"F2","B'",'B',"B2"];
  var FGRP = [0,0,0,1,1,1,2,2,2,3,3,3,4,4,4,5,5,5];
  var OPP = {0:1,1:0,2:3,3:2,4:5,5:4};

  var s = _lbl.clone(initState);
  var solution = [];

  function heuristic() {
    var h = 0;
    if (!(s.U[7]==='W'&&s.F[1]==='R')) h++;
    if (!(s.U[5]==='W'&&s.R[1]==='B')) h++;
    if (!(s.U[1]==='W'&&s.B[1]==='O')) h++;
    if (!(s.U[3]==='W'&&s.L[1]==='G')) h++;
    return h;
  }

  function dfs(depth, lastF, lastLF) {
    var h = heuristic();
    if (h === 0) return true;
    if (h > depth) return false;
    if (depth === 0) return false;

    for (var i = 0; i < 18; i++) {
      var f = FGRP[i];
      if (f === lastF) continue;
      if (f === lastLF && OPP[f] === lastF) continue;
      if (OPP[f] === lastF && f > lastF) continue;

      _lbl.dm(s, MOVES[i]);
      if (dfs(depth - 1, f, lastF)) {
        solution.unshift(MOVES[i]);
        _lbl.dm(s, UNDOS[i]);
        return true;
      }
      _lbl.dm(s, UNDOS[i]);
    }
    return false;
  }

  for (var maxD = 0; maxD <= 8; maxD++) {
    solution = [];
    if (dfs(maxD, -1, -1)) {
      _lbl.dms(initState, solution);
      return {steps: [{explain: '白色十字('+solution.length+'步)', moves: solution}]};
    }
  }

  return _lbl.solveStage1(initState);
};

_lbl.solve1LookPLL = function(state) {
  var dS = [[], ['D'], ['D2'], ["D'"]];
  function allOK(st) {
    return ['F','R','B','L'].every(function(f){
      return st[f][6]===st[f][4]&&st[f][7]===st[f][4]&&st[f][8]===st[f][4];
    });
  }
  if (allOK(state)) return {steps:[]};
  
  for (var di = 0; di < 4; di++) {
    for (var pi = 0; pi < PLL_21.length; pi++) {
      var mv = dS[di].concat(PLL_21[pi]);
      var ts = _lbl.clone(state); _lbl.dms(ts, mv);
      for (var adj = 0; adj < 4; adj++) {
        if (allOK(ts)) {
          var full = mv.slice(); for (var a = 0; a < adj; a++) full.push('D');
          _lbl.dms(state, full);
          return {steps: [{explain:'PLL(1-Look)', moves:full}]};
        }
        _lbl.dm(ts, 'D');
      }
    }
  }
  // Fallback to 2-Look
  return _lbl.solve2LookPLL(state);
};

function doLBLSolve(){
  // Stop camera
  try{if(vid&&vid.srcObject){vid.srcObject.getTracks().forEach(function(t){t.stop();});vid.srcObject=null;}}catch(e){}
  if(vid)vid.style.display='none';
  document.querySelector('.wrap').style.background='#000';
  if(ov)ov.style.display='none';
  
  document.getElementById('topBar').style.display='none';
  document.getElementById('botBar').style.display='none';
  
  // Show computing overlay
  document.getElementById('info').textContent='🧩 CFOP v3 計算中...';
  
  // Run engine
  setTimeout(function(){
    try{
      var initState={};
      ['U','R','F','D','L','B'].forEach(function(f){initState[f]=faceColors[f].slice();});
      var result=_lbl.cfopEngine(initState);
      
      // Verify
      var solved=_lbl.solved(),ok=true;
      ['U','R','F','D','L','B'].forEach(function(f){for(var i=0;i<9;i++){if(result.state[f][i]!==solved[f][i])ok=false;}});
      
      if(!ok){
        alert('⚠️ CFOP 引擎無法完全還原此狀態。\n可能是顏色辨識有誤，請重新掃描或手動修正。');
        location.reload();
        return;
      }
      
      // Build solution array + stage markers
      solution=[];
      window._lblStageMarkers=[];
      var totalMoves=0;
      for(var i=0;i<result.script.length;i++){
        var step=result.script[i];
        window._lblStageMarkers.push({idx:totalMoves,stage:step.stage,explain:step.explain});
        for(var j=0;j<step.moves.length;j++)solution.push(step.moves[j]);
        totalMoves+=step.moves.length;
      }
      
      // Setup cubeState
      ['U','R','F','D','L','B'].forEach(function(f){cubeState[f]=faceColors[f].slice();});
      solveStep=-1;
      mode='solve';
      
      // Compute energy path first, then show level briefing
      setTimeout(function(){
        if(!window._lblStageMarkers||!solution.length)return;
        var replay={};['U','R','F','D','L','B'].forEach(function(f){replay[f]=faceColors[f].slice();});
        window._energyAtStep=[_lbl.getEnergyScore(replay)];
        window._initialEnergy=window._energyAtStep[0];
        for(var ei=0;ei<solution.length;ei++){_lbl.dm(replay,solution[ei]);window._energyAtStep.push(_lbl.getEnergyScore(replay));}
        window._lblStageMarkers.forEach(function(m,idx){
          var nextIdx=(idx+1<window._lblStageMarkers.length)?window._lblStageMarkers[idx+1].idx:solution.length;
          m.spell=classifySpell(m.stage,m.explain);
          m.energyBefore=window._energyAtStep[m.idx];
          m.energyAfter=window._energyAtStep[nextIdx];
          m.energyDrop=m.energyBefore-m.energyAfter;
        });
        // Show Level 1 briefing instead of directly starting
        document.getElementById('startOv').style.display='none';
        document.getElementById('solveUI').style.display='flex';
        document.getElementById('botBar').style.display='none';
        document.getElementById('topBar').style.display='none';
        levelMgr.showBriefing(1);
      },100);
    }catch(e){
      alert('CFOP 引擎錯誤: '+e.message);
      location.reload();
    }
  },50);
}

// === miniArrowSVG: returns <img> from MOVE_IMGS ===
function miniArrowSVG(mv){
  var src=MOVE_IMGS[mv];
  if(!src) return '<span style="font-size:20px;font-weight:900;color:#FFD700;font-family:monospace">'+mv+'</span>';

}

var CORNER_HOMES=[{c1:'W',c2:'R',c3:'B',f1:'U',p1:8,f2:'F',p2:2,f3:'R',p3:0},{c1:'W',c2:'R',c3:'G',f1:'U',p1:6,f2:'F',p2:0,f3:'L',p3:2},{c1:'W',c2:'O',c3:'B',f1:'U',p1:2,f2:'B',p2:0,f3:'R',p3:2},{c1:'W',c2:'O',c3:'G',f1:'U',p1:0,f2:'B',p2:2,f3:'L',p3:0},{c1:'Y',c2:'R',c3:'B',f1:'D',p1:2,f2:'F',p2:8,f3:'R',p3:6},{c1:'Y',c2:'R',c3:'G',f1:'D',p1:0,f2:'F',p2:6,f3:'L',p3:8},{c1:'Y',c2:'O',c3:'B',f1:'D',p1:8,f2:'B',p2:6,f3:'R',p3:8},{c1:'Y',c2:'O',c3:'G',f1:'D',p1:6,f2:'B',p2:8,f3:'L',p3:6}];

_lbl.getEnergyScore=function(state){var energy=0;
  EDGE_HOMES.forEach(function(h){if(state[h.f1][h.p1]===h.c1&&state[h.f2][h.p2]===h.c2)return;var piece=_lbl.findEdge(state,h.c1,h.c2);if(!piece)return;var hL=h.f1==='U'?'U':(h.f1==='D'?'D':'E');energy+=(piece.layer===hL)?20:50;if(hL==='U'&&piece.layer==='U'){var pp={UF:7,UR:5,UB:1,UL:3}[piece.slot];if(pp!==undefined&&state.U[pp]!==h.c1)energy+=30;}if(hL==='D'&&piece.layer==='D'){var pp2={DF:1,DR:5,DB:7,DL:3}[piece.slot];if(pp2!==undefined&&state.D[pp2]!==h.c1)energy+=30;}});
  CORNER_HOMES.forEach(function(h){if(state[h.f1][h.p1]===h.c1&&state[h.f2][h.p2]===h.c2&&state[h.f3][h.p3]===h.c3)return;var piece=_lbl.findCorner(state,h.c1,h.c2,h.c3);if(!piece)return;var hL=h.f1==='U'?'U':'D';energy+=(piece.layer===hL)?20:50;if(piece.layer==='U'){var pp={UFR:8,UFL:6,UBR:2,UBL:0}[piece.slot];if(pp!==undefined&&state.U[pp]!==h.c1)energy+=30;}if(piece.layer==='D'){var pp2={DFR:2,DFL:0,DBR:8,DBL:6}[piece.slot];if(pp2!==undefined&&state.D[pp2]!==h.c1)energy+=30;}});
  return energy;
};

function classifySpell(stage,explain){
  if(stage==='Cross')return{name:'白色十字',icon:'✚',type:'吸入咒',typeIcon:'🧲'};
  if(explain.indexOf('踢出')>=0)return{name:'地洞脫逃',icon:'🕳️',type:'吸入咒',typeIcon:'🧲'};
  if(explain.indexOf('F2L')>=0||explain.indexOf('好朋友')>=0)return{name:'好朋友回家',icon:'🏠',type:'吸入咒',typeIcon:'🧲'};
  if(explain.indexOf('黃色十字')>=0)return{name:'十字咒',icon:'✚',type:'翻轉咒',typeIcon:'🔄'};
  if(explain.indexOf('OLL')>=0||explain.indexOf('角塊方向')>=0)return{name:'小魚咒',icon:'🐟',type:'翻轉咒',typeIcon:'🔄'};
  if(explain.indexOf('PLL')>=0)return{name:'大搬家',icon:'🏗️',type:'換位咒',typeIcon:'🔀'};
  return{name:explain,icon:'🔮',type:'基礎',typeIcon:'⚙️'};
}

  stageToLevel:function(stage){
    if(stage==='Cross')return 1;
    if(stage==='F2L')return 2;
    return 3;
  },
  getLevelBounds:function(lv){
    if(!window._lblStageMarkers)return{start:0,end:0};
    var start=-1,end=solution.length;
    var targetStages=this.levels[lv-1].stages;
    for(var i=0;i<window._lblStageMarkers.length;i++){
      var m=window._lblStageMarkers[i];
      if(targetStages.indexOf(m.stage)>=0&&start<0)start=m.idx;
    }
    // Find end: first marker NOT in this level's stages after start
    for(var i=0;i<window._lblStageMarkers.length;i++){
      var m=window._lblStageMarkers[i];
      if(m.idx>start&&targetStages.indexOf(m.stage)<0){end=m.idx;break;}
    }
    if(start<0)start=0;
    return{start:start,end:end};
  },
  getLevelEnergy:function(lv){
    var b=this.getLevelBounds(lv);
    if(!window._energyAtStep)return{before:0,after:0,drop:0};
    var before=window._energyAtStep[b.start]||0;
    var after=window._energyAtStep[b.end]||0;
    return{before:before,after:after,drop:before-after};
  },
  showBriefing:function(lv){
    this.current=lv;

  showLevelComplete:function(lv){
    var L=this.levels[lv-1];

    // Check if this step crosses into a new level
    var si=getLBLStageInfo(stepIdx);

      this.showLevelComplete(this.current);
      return true; // signal to pause

    return false;
  }
