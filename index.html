<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>魔方小老師 v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:#000;color:#fff;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.wrap{position:relative;flex:1;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;background:#000}
canvas#ov{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.top-bar{position:absolute;top:0;left:0;right:0;z-index:10;padding:10px 16px;text-align:center;background:linear-gradient(rgba(0,0,0,.8),transparent);padding-bottom:28px;display:none}
.top-title{font-size:18px;font-weight:900;color:#FFD700}
.top-sub{font-size:12px;color:#ddd;margin-top:2px}
.top-dots{display:flex;justify-content:center;gap:5px;margin-top:6px}
.td{width:20px;height:5px;border-radius:3px;background:rgba(255,255,255,.15)}
.td.done{background:#00D2FF}.td.now{background:#FFD700;width:32px}
.bot-bar{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:8px 16px 20px;background:linear-gradient(transparent,rgba(0,0,0,.9));padding-top:24px;text-align:center;display:none}
.info{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:8px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:78px;margin:0 auto 8px}
.mcell{aspect-ratio:1;border-radius:3px;border:1px solid rgba(255,255,255,.15)}
@keyframes flashWarn{0%,100%{box-shadow:0 0 0 2px rgba(255,60,60,.9)}50%{box-shadow:0 0 8px 2px rgba(255,60,60,.3)}}
@keyframes flashBad{0%,100%{box-shadow:0 0 0 3px rgba(255,20,20,1);border-color:rgba(255,20,20,1)}50%{box-shadow:0 0 10px 3px rgba(255,20,20,.4);border-color:rgba(255,80,80,.6)}}
@keyframes flashFix{0%,100%{box-shadow:0 0 0 3px rgba(0,230,64,1);border-color:rgba(0,230,64,1)}50%{box-shadow:0 0 12px 3px rgba(0,230,64,.3);border-color:rgba(0,230,64,.5)}}
.mcell-warn{animation:flashWarn 1s infinite}
.mcell-bad{animation:flashBad .8s infinite}
.mcell-fix{animation:flashFix .8s infinite}
.btn{padding:14px 32px;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;cursor:pointer;background:#FFD700;color:#000;min-width:120px}
.btn:active{transform:scale(.96);opacity:.9}
.btn-sm{padding:10px 20px;font-size:14px}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.overlay{display:none;position:absolute;inset:0;z-index:25;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85)}
.overlay.show{display:flex}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes x2pulse{0%,100%{box-shadow:0 0 8px #FF1744}50%{box-shadow:0 0 20px #FF1744}}
</style>
</head>
<body>

 <div style="flex-shrink:0;padding:2px 6px;text-align:center">
  <div id="stageLabel"></div>
  <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0">
   <div style="text-align:center"><div style="font-size:7px;color:rgba(255,255,255,.25)">操作前</div><div class="mgrid" id="beforeGrid" style="display:grid;width:48px;grid-template-columns:repeat(3,1fr);gap:1px;margin:1px auto"></div></div>

 <button class="btn btn-sm" style="margin-top:10px;background:rgba(255,255,255,.12);color:#ccc" onclick="startGallery()">🖼️ 從圖庫上傳 6 張照片</button>

function initSolver(){
  const lib=document.getElementById('cubejs-src').textContent;
  const code=lib+`\nconst C=self.Cube||(typeof Cube!=='undefined'?Cube:null);let rdy=false;function isVP(a,n){var s=new Set(a);if(s.size!==n)return false;for(var v of a)if(v<0||v>=n)return false;return true;}function pp(arr){let v=new Array(arr.length).fill(false),p=0;for(let i=0;i<arr.length;i++){if(!v[i]){let j2=i,len=0;while(!v[j2]){v[j2]=true;j2=arr[j2];len++;}if(len>1)p+=(len-1);}}return p%2;}self.onmessage=function(e){if(e.data.t==='init'){try{C.initSolver();rdy=true;postMessage({t:'ok'})}catch(er){postMessage({t:'err',m:er.message})}}if(e.data.t==='solve'){if(!rdy){C.initSolver();rdy=true}try{var c=C.fromString(e.data.fl);postMessage({t:'sol',s:c.solve()})}catch(er){postMessage({t:'err',m:er.message})}}if(e.data.t==='validate'){if(!rdy){C.initSolver();rdy=true}try{var c=C.fromString(e.data.fl);var j=c.toJSON();var eoP=j.eo.reduce(function(a,b){return a+b},0)%2;var coP=j.co.reduce(function(a,b){return a+b},0)%3;var epP=pp(j.ep);var cpP=pp(j.cp);var ok=isVP(j.ep,12)&&isVP(j.cp,8)&&eoP===0&&coP===0&&epP===cpP;postMessage({t:'valid',ok:ok,eoP:eoP,coP:coP,epP:epP,cpP:cpP})}catch(er){postMessage({t:'valid',ok:false,err:er.message})}}if(e.data.t==='autofix'){if(!rdy){C.initSolver();rdy=true}var arr=e.data.fl.split('');for(var i2=0;i2<54;i2++){if(i2%9===4)continue;for(var j3=i2+1;j3<54;j3++){if(j3%9===4)continue;if(arr[i2]===arr[j3])continue;var tmp=arr[i2];arr[i2]=arr[j3];arr[j3]=tmp;var test=arr.join('');var cnt2={};for(var ch2 of test)cnt2[ch2]=(cnt2[ch2]||0)+1;if(!Object.values(cnt2).every(function(v2){return v2===9})){arr[j3]=arr[i2];arr[i2]=tmp;continue;}try{var c2=C.fromString(test);var js2=c2.toJSON();if(!isVP(js2.ep,12)||!isVP(js2.cp,8)){arr[j3]=arr[i2];arr[i2]=tmp;continue;}var eo2=js2.eo.reduce(function(a,b){return a+b},0)%2;var co2=js2.co.reduce(function(a,b){return a+b},0)%3;var ep2=pp(js2.ep);var cp2=pp(js2.cp);if(eo2===0&&co2===0&&ep2===cp2){postMessage({t:'autofix',ok:true,str:test,swap:[i2,j3]});return;}}catch(e3){}arr[j3]=arr[i2];arr[i2]=tmp;}}postMessage({t:'autofix',ok:false})}if(e.data.t==='autofixAll'){if(!rdy){C.initSolver();rdy=true}var arr=e.data.fl.split('');var allSwaps=[];for(var i2=0;i2<54;i2++){if(i2%9===4)continue;for(var j3=i2+1;j3<54;j3++){if(j3%9===4)continue;if(arr[i2]===arr[j3])continue;var tmp=arr[i2];arr[i2]=arr[j3];arr[j3]=tmp;var test=arr.join('');try{var c2=C.fromString(test);var js2=c2.toJSON();if(isVP(js2.ep,12)&&isVP(js2.cp,8)){var eo2=js2.eo.reduce(function(a,b){return a+b},0)%2;var co2=js2.co.reduce(function(a,b){return a+b},0)%3;var ep2=pp(js2.ep);var cp2=pp(js2.cp);if(eo2===0&&co2===0&&ep2===cp2){allSwaps.push([i2,j3]);}}}catch(e3){}arr[j3]=arr[i2];arr[i2]=tmp;}}postMessage({t:'autofixAll',swaps:allSwaps})}};`;
  solverWorker=new Worker(URL.createObjectURL(new Blob([code],{type:'application/javascript'})));
  solverReady=false;
  solverWorker.onmessage=e=>{
    if(e.data.t==='ok'){solverReady=true;var bs=document.getElementById('brainStatus');if(bs){bs.innerHTML='🧠 魔方大腦已就緒 ✅';setTimeout(function(){bs.style.opacity='0';},1500);}}
    if(e.data.t==='sol'&&solverCB)solverCB(null,e.data.s);
    if(e.data.t==='err'&&solverCB)solverCB(new Error(e.data.m));
  };
  solverWorker.onerror=e=>{solverReady=true;if(solverCB)solverCB(new Error('Worker crashed'));};
  solverWorker.postMessage({t:'init'});
}

function handleGalleryFiles(files){

  if(imgs.length<6){alert('請選擇 6 張照片（順序：F紅→R藍→B橘→L綠→U白→D黃）');return;}

function showGalleryStep(){
  const idx=window._galleryIdx;
  if(idx>=6){document.getElementById('title').textContent='✅ 6面上傳完成！';document.getElementById('sub').textContent='按下方按鈕分析顏色';document.getElementById('btnRow').innerHTML='<button class="btn" onclick="doClassify()">🔍 分析顏色</button>';return;}

  document.getElementById('dots').innerHTML=SCAN_SEQ.map((_,i)=>'<div class="td'+(i<idx?' done':'')+(i===idx?' now':'')+'"></div>').join('');
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();img.onload=function(){processGalleryImage(img,idx);};img.src=e.target.result;
  };
  reader.readAsDataURL(window._galleryImgs[idx]);
}
function processGalleryImage(img,idx){
  const vw=img.width,vh=img.height;
  const tc=document.createElement('canvas');tc.width=vw;tc.height=vh;
  const tctx=tc.getContext('2d');tctx.drawImage(img,0,0,vw,vh);
  const gs=Math.min(vw,vh)*0.82,cs=gs/3,sx=(vw-gs)/2,sy=(vh-gs)/2;
  let rgbs=[];
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
    const px=Math.round(sx+(c+.5)*cs),py=Math.round(sy+(r+.5)*cs);
    const half=Math.round(cs*SCAN_CONFIG.sampleRadius);const sampleSize=half*2+1;
    const d=tctx.getImageData(Math.max(0,px-half),Math.max(0,py-half),sampleSize,sampleSize);
    var pixels=[];for(let i=0;i<d.data.length;i+=4){pixels.push([d.data[i],d.data[i+1],d.data[i+2]]);}
    if(pixels.length>8){
      pixels.sort(function(a,b){return (a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]);});
      var trim=Math.floor(pixels.length*SCAN_CONFIG.trimRatio);
      pixels=pixels.slice(trim,pixels.length-trim);
    }
    let rr=0,gg=0,bb=0;pixels.forEach(function(p){rr+=p[0];gg+=p[1];bb+=p[2];});
    const n=pixels.length;rgbs.push([Math.round(rr/n),Math.round(gg/n),Math.round(bb/n)]);
  }
  rawData[SCAN_SEQ[idx].f]=rgbs;
  const mg=document.getElementById('mgrid');mg.style.display='grid';
  mg.innerHTML=rgbs.map(([r,g,b],i)=>'<div class="mcell" style="background:rgb('+r+','+g+','+b+')">'+(i===4?'⭐':'')+'</div>').join('');
  window._galleryIdx++;
  setTimeout(showGalleryStep,300);
}

function drawGuideGrid(){
  if(!ov||!ov.width)return;
  const vw=ov.width,vh=ov.height;octx.clearRect(0,0,vw,vh);
  const gs=Math.min(vw,vh)*0.82,cs=gs/3,sx=(vw-gs)/2,sy=(vh-gs)/2;
  octx.fillStyle='rgba(0,0,0,.25)';
  octx.fillRect(0,0,vw,sy);octx.fillRect(0,sy+gs,vw,vh-sy-gs);octx.fillRect(0,sy,sx,gs);octx.fillRect(sx+gs,sy,vw-sx-gs,gs);
  octx.strokeStyle='rgba(255,215,0,.5)';octx.lineWidth=1.5;
  for(let i=0;i<=3;i++){octx.beginPath();octx.moveTo(sx+i*cs,sy);octx.lineTo(sx+i*cs,sy+gs);octx.stroke();octx.beginPath();octx.moveTo(sx,sy+i*cs);octx.lineTo(sx+gs,sy+i*cs);octx.stroke();}
  octx.strokeStyle='#FFD700';octx.lineWidth=3;
  const m=14;
  [[sx,sy],[sx+gs,sy],[sx,sy+gs],[sx+gs,sy+gs]].forEach(([x,y])=>{const dx=x===sx?1:-1,dy=y===sy?1:-1;octx.beginPath();octx.moveTo(x+m*dx,y);octx.lineTo(x,y);octx.lineTo(x,y+m*dy);octx.stroke();});
}

// Paint bucket mode: R(8)→B(8)→O(8)→G(8)→W(8)→Y(8), click again to clear
var _paintSeq=['R','B','O','G','W','Y'];

function paintCell(f,i){
  if(i===4)return;
  var cur=faceColors[f][i],brush=_paintSeq[_paintIdx];
  var corrMode=!!document.getElementById('corrColorBar');
  if(cur===brush){
    // Same color = clear
    faceColors[f][i]='X';_paintCounts[brush]--;
  } else if(cur!=='X'){
    // Overwrite different color: remove old, add new (total unchanged)
    _paintCounts[cur]--;
    faceColors[f][i]=brush;_paintCounts[brush]=((_paintCounts[brush])||0)+1;
  } else {
    // Empty cell: paint (skip limit in correction mode)
    if(!corrMode&&(_paintCounts[brush]||0)>=8)return;
    faceColors[f][i]=brush;_paintCounts[brush]=((_paintCounts[brush])||0)+1;
  }
  _autoAdvance();showEditableFaces();
}
// ===== PIECE VALIDATION: find bad corners/edges for red flash =====
var _CORNERS=[
  [['U',8],['R',0],['F',2]],[['U',6],['F',0],['L',2]],
  [['U',0],['L',0],['B',2]],[['U',2],['B',0],['R',2]],
  [['D',2],['F',8],['R',6]],[['D',0],['L',8],['F',6]],
  [['D',6],['B',8],['L',6]],[['D',8],['R',8],['B',6]]
];
var _EDGES=[
  [['U',5],['R',1]],[['U',7],['F',1]],[['U',3],['L',1]],[['U',1],['B',1]],
  [['D',5],['R',7]],[['D',1],['F',7]],[['D',3],['L',7]],[['D',7],['B',7]],
  [['F',5],['R',3]],[['F',3],['L',5]],[['B',5],['L',3]],[['B',3],['R',5]]
];
var _VALID_C=['BRW','GRW','GOW','BOW','BRY','GRY','GOY','BOY'];
var _VALID_E=['BW','RW','GW','OW','BY','RY','GY','OY','BR','GR','BO','GO'];
function _cloneFC(fc){var c={};['U','R','F','D','L','B'].forEach(function(f){c[f]=fc[f].slice();});return c;}
function _rot180(fc,f){var a=fc[f];fc[f]=[a[8],a[7],a[6],a[5],a[4],a[3],a[2],a[1],a[0]];}
function _rotCW(fc,f){var a=fc[f];fc[f]=[a[6],a[3],a[0],a[7],a[4],a[1],a[8],a[5],a[2]];}
function _rotCCW(fc,f){var a=fc[f];fc[f]=[a[2],a[5],a[8],a[1],a[4],a[7],a[0],a[3],a[6]];}
function findBadCellsFor(fc){
  var bad={};
  var cSeen={};
  _CORNERS.forEach(function(cn){
    var cs=cn.map(function(p){return fc[p[0]][p[1]];}).sort().join('');
    if(_VALID_C.indexOf(cs)===-1){cn.forEach(function(p){bad[p[0]+'_'+p[1]]='不存在的角塊';});}
    else{if(!cSeen[cs])cSeen[cs]=[];cSeen[cs].push(cn);}
  });
  Object.keys(cSeen).forEach(function(k){if(cSeen[k].length>1)cSeen[k].forEach(function(cn){cn.forEach(function(p){bad[p[0]+'_'+p[1]]='重複角塊';});});});
  var eSeen={};
  _EDGES.forEach(function(ed){
    var cs=ed.map(function(p){return fc[p[0]][p[1]];}).sort().join('');
    if(_VALID_E.indexOf(cs)===-1){ed.forEach(function(p){bad[p[0]+'_'+p[1]]='不存在的邊塊';});}
    else{if(!eSeen[cs])eSeen[cs]=[];eSeen[cs].push(ed);}
  });
  Object.keys(eSeen).forEach(function(k){if(eSeen[k].length>1)eSeen[k].forEach(function(ed){ed.forEach(function(p){bad[p[0]+'_'+p[1]]='重複邊塊';});});});
  return bad;
}
function findBadCells(){return findBadCellsFor(faceColors);}

// === 2D→3D 智能映射轉譯器 (AutoOrientationMapper) ===
// 解決使用者色塊正確但 epP 錯誤的「3D→2D 視角翻轉」問題
// 原理：不改變使用者填的顏色，自動修正看魔方時的視角旋轉誤差
var AutoOrientationMapper={
  strategies:[
    {name:'原始',fix:function(fc){return _cloneFC(fc);}},
    {name:'B面180°',fix:function(fc){var c=_cloneFC(fc);_rot180(c,'B');return c;}},
    {name:'D面180°',fix:function(fc){var c=_cloneFC(fc);_rot180(c,'D');return c;}},
    {name:'B+D面180°',fix:function(fc){var c=_cloneFC(fc);_rot180(c,'B');_rot180(c,'D');return c;}},
    {name:'L面CCW90°',fix:function(fc){var c=_cloneFC(fc);_rotCCW(c,'L');return c;}},
    {name:'R面CW90°',fix:function(fc){var c=_cloneFC(fc);_rotCW(c,'R');return c;}},
    {name:'B面180°+L面CCW90°',fix:function(fc){var c=_cloneFC(fc);_rot180(c,'B');_rotCCW(c,'L');return c;}},
    {name:'B面180°+R面CW90°',fix:function(fc){var c=_cloneFC(fc);_rot180(c,'B');_rotCW(c,'R');return c;}}
  ],
  // 找出最佳映射：先試純旋轉，再試旋轉+swap
  findBestMapping:function(fc,validateFn,swapFixFn,callback){
    var self=this;var bestRotation=null;var bestBadCount=999;
    // Phase 1: 純旋轉直接通過？
    for(var i=0;i<self.strategies.length;i++){
      var s=self.strategies[i];
      var mapped=s.fix(fc);
      var fl='';['U','R','F','D','L','B'].forEach(function(f){mapped[f].forEach(function(x){fl+=C2F[x]||'?';});});
      if(validateFn(fl)){
        callback({type:'perfect',strategy:s.name,fc:mapped,fl:fl});return;
      }
      var badCount=Object.keys(findBadCellsFor(mapped)).length;
      if(badCount<bestBadCount){bestBadCount=badCount;bestRotation={strategy:s.name,fc:mapped,fl:fl,badCount:badCount};}
    }
    // Phase 2: 壞積木=0 的旋轉 + Worker autofix swap
    if(bestRotation&&bestRotation.badCount===0){
      swapFixFn(bestRotation.fl,function(swapResult){
        if(swapResult){
          callback({type:'rotation+swap',strategy:bestRotation.strategy,fc:bestRotation.fc,swap:swapResult});
        } else {
          callback({type:'rotation_only',strategy:bestRotation.strategy,fc:bestRotation.fc,badCount:0});
        }
      });
      return;
    }
    // Phase 3: 無法修復
    callback({type:'failed',bestStrategy:bestRotation?bestRotation.strategy:null,badCount:bestBadCount});
  }
};

function syncFixedStateToCube(validFL){

  let idx=0;for(const face of KO)for(let i=0;i<9;i++)faceColors[face][i]=f2c[validFL.charAt(idx++)];

function bridgeToCFOP(kSolution){
  if(!kSolution||kSolution.trim()==='')return _lbl.solved();
  var moves=kSolution.trim().split(/\s+/);var scramble=[];
  for(var i=moves.length-1;i>=0;i--){var m=moves[i];if(m.includes('2'))scramble.push(m);else if(m.includes("'"))scramble.push(m.replace("'",""));else scramble.push(m+"'");}
  var vs=_lbl.solved();scramble.forEach(function(m){_lbl.dm(vs,m);});
  return vs;
}

// === Phase 2: 互動式候選列表（非同步）===
function _runPhase2(strategyName,mappedFC,mappedFL){
  document.getElementById('info').innerHTML='<span style="color:rgba(0,210,255,.9);font-size:13px">🔍 Phase 2：'+strategyName+' + 搜尋填色誤差...</span>';
  var prev2=solverWorker.onmessage;
  solverWorker.onmessage=function(ea){
    if(ea.data.t==='autofixAll'){
      solverWorker.onmessage=prev2;
      var swaps=ea.data.swaps;
      if(swaps.length===0){_runPhase3();return;}
      // 建立候選列表
      var faces3=['U','R','F','D','L','B'];
      var candidates=swaps.map(function(pair){
        var i1=pair[0],i2=pair[1];
        var f1=faces3[Math.floor(i1/9)],p1=i1%9;
        var f2=faces3[Math.floor(i2/9)],p2=i2%9;
        return{i:i1,j:i2,f1:f1,p1:p1,c1:mappedFC[f1][p1],f2:f2,p2:p2,c2:mappedFC[f2][p2]};
      });
      // 排序：同面>鄰面>易混色
      var adjMap={U:'FRBL',R:'UFDB',F:'URDL',D:'FRBL',L:'UFDB',B:'URDL'};
      candidates.forEach(function(s){
        s.score=0;
        if(s.f1===s.f2)s.score+=10;
        if(adjMap[s.f1].indexOf(s.f2)!==-1)s.score+=5;
        var conf=[['R','O'],['B','G'],['W','Y']];
        conf.forEach(function(p){if((s.c1===p[0]&&s.c2===p[1])||(s.c1===p[1]&&s.c2===p[0])){s.score+=8;s.confuse=true;}});
        if(s.p1%2===1&&s.p2%2===1)s.score+=3;
      });
      candidates.sort(function(a,b){return b.score-a.score;});
      // 儲存供 UI 使用
      window._phase2={strategyName:strategyName,mappedFC:mappedFC,candidates:candidates};
      _showPhase2UI();
    }
  };
  solverWorker.postMessage({t:'autofixAll',fl:mappedFL});
}

    var target = (current === 0) ? 1 : (current === 1) ? 2 : 4;

_lbl.solveStage1=function(state) {

        var cf=(function(u,f,c){return function(st){return _lbl.crossEdgeOK(st,u,f,c);};})(ct.u,ct.f,ct.c);

_lbl.E_KICKOUT={"FR":[["R'","D","R"],["F","D'","F'"]],"FL":[["L","D'","L'"],["F'","D","F"]],"BR":[["R","D'","R'"],["B'","D","B"]],"BL":[["L'","D","L"],["B","D'","B'"]]};

function optimizeMoves(mvs){
  let arr=[...mvs];
  let changed=true;
  while(changed){
    changed=false;
    for(let i=0;i<arr.length-1;i++){
      const a=arr[i],b=arr[i+1];
      if(a[0]!==b[0])continue; // different face
      const face=a[0];
      // Convert to quarter turns: X=1, X'=-1, X2=2
      function toQ(m){if(m.includes('2'))return 2;if(m.includes("'"))return -1;return 1;}
      function fromQ(f,q){q=((q%4)+4)%4;if(q===0)return null;if(q===1)return f;if(q===2)return f+'2';return f+"'";}
      const qa=toQ(a),qb=toQ(b);
      const sum=(qa+qb)%4;
      const merged=fromQ(face,sum);
      if(merged===null){
        arr.splice(i,2); // cancel out
      }else{
        arr.splice(i,2,merged); // merge
      }
      changed=true;
      break;
    }
  }
  return arr;
}

var SLOT_MAP = {

function mapFormula(frMoves, slot) {

function isPairSolved(st, p) {

function allIntact(st, solvedSlots) {

// === Smart Joint-Extraction ===
function getSafeKickouts(targetSlot, solvedSlots) {
  var safe = ['FR','FL','BR','BL'].filter(function(s) {
    return solvedSlots.indexOf(s) < 0 || s === targetSlot;
  });
  var kicks = [];
  safe.forEach(function(sl) {
    if(sl==='FR'){kicks.push(["R'","D","R"],["R'","D'","R"],["R'","D2","R"],["F","D","F'"],["F","D'","F'"],["F","D2","F'"]);}
    if(sl==='FL'){kicks.push(["L","D","L'"],["L","D'","L'"],["L","D2","L'"],["F'","D","F"],["F'","D'","F"],["F'","D2","F"]);}

  });

}

function smartExtract(state, pair, solvedSlots) {
  var cc = pair.corner, ee = pair.edge;
  function bothInD(st) {
    var c = _lbl.findCorner(st, cc[0], cc[1], cc[2]);
    var e = _lbl.findEdge(st, ee[0], ee[1]);
    return c && e && c.layer === 'D' && e.layer === 'D';
  }
  if (bothInD(state)) return [];
  var kicks = getSafeKickouts(pair.slot, solvedSlots);
  // Depth 1
  for (var i = 0; i < kicks.length; i++) {
    var t = _lbl.clone(state); _lbl.dms(t, kicks[i]);
    if (bothInD(t) && allIntact(t, solvedSlots)) return kicks[i];
  }
  // Depth 2
  for (var i2 = 0; i2 < kicks.length; i2++) {
    var t1 = _lbl.clone(state); _lbl.dms(t1, kicks[i2]);
    if (!allIntact(t1, solvedSlots)) continue;
    for (var j = 0; j < kicks.length; j++) {
      var t2 = _lbl.clone(t1); _lbl.dms(t2, kicks[j]);
      if (bothInD(t2) && allIntact(t2, solvedSlots)) return kicks[i2].concat(kicks[j]);
    }
  }
  return null;
}


// === CFOP F2L Main: Full-search kickout × D-prefix × formula ===
_lbl.solveCFOPF2L = function(state) {
  var steps = [], solvedSlots = [];
  var dPrefixes = [[], ['D'], ['D2'], ["D'"]];

    var kicks = getSafeKickouts(pair.slot, solvedSlots);
    var allKicks = [[]];
    for (var k1 = 0; k1 < kicks.length; k1++) allKicks.push(kicks[k1]);
    for (var k2 = 0; k2 < kicks.length; k2++)
      for (var k3 = 0; k3 < kicks.length; k3++)
        allKicks.push(kicks[k2].concat(kicks[k3]));

    var bestMoves = null, bestLen = 999;
    for (var kIdx = 0; kIdx < allKicks.length; kIdx++) {
      var kick = allKicks[kIdx];
      var stK = _lbl.clone(state); _lbl.dms(stK, kick);
      if (!allIntact(stK, solvedSlots)) continue;

        for (var fi = 0; fi < F2L_FR_FORMULAS.length; fi++) {
          var mapped = mapFormula(F2L_FR_FORMULAS[fi], pair.slot);
          var cand = kick.concat(dPrefixes[dpi]).concat(mapped);
          if (cand.length >= bestLen) continue;
          var tv = _lbl.clone(state); _lbl.dms(tv, cand);
          if (isPairSolved(tv, pair) && allIntact(tv, solvedSlots)) {
            bestLen = cand.length; bestMoves = cand;
          }

    }

    }

    var mid=_lbl.MID.find(function(m){return m.n===pair.name;});
    if(mid){for(var a3=0;a3<8;a3++){if(_lbl.edgeOK(state,mid))break;var e2=_lbl.findEdge(state,mid.c1,mid.c2);if(!e2)break;if(e2.layer==='E'){var kf=_lbl.F2L_FORMULAS[e2.slot];if(kf){_lbl.dms(state,kf.right);steps.push({explain:'LBL邊塊踢出',moves:kf.right});}continue;}if(e2.layer==='D'){var cs=[];for(var k=0;k<_lbl.MID.length;k++){if(_lbl.MID[k].n!==pair.name&&_lbl.edgeOK(state,_lbl.MID[k]))cs.push(_lbl.MID[k]);}var sol=_lbl.findF2LInsert(state,mid,cs);if(sol){if(sol.setup.length>0){_lbl.dms(state,sol.setup);steps.push({explain:'LBL對齊',moves:sol.setup});}_lbl.dms(state,sol.formula);steps.push({explain:'LBL插入',moves:sol.formula});}break;}}}
    if(isPairSolved(state,pair))solvedSlots.push(pair.slot);
  }

};

// === CFOP Engine v2 ===
_lbl.cfopEngine = function(init) {
  var s = _lbl.clone(init), script = [], mc = 0;
  function recOnly(stage, explain, moves) {
    if (!moves || !moves.length) return;
    script.push({stage: stage, explain: explain, moves: moves}); mc += moves.length;
  }
  var r1 = _lbl.solveCrossIDDFS(s); if (r1) r1.steps.forEach(function(st) { recOnly('Cross', st.explain, st.moves); });
  var rF = _lbl.solveCFOPF2L(s); if (rF) rF.steps.forEach(function(st) { recOnly('F2L', st.explain, st.moves); });
  var r4 = _lbl.solveStage4(s); if (r4) r4.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); });
  var r5 = _lbl.solveStage5(s); if (r5 && r5.moves.length > 0) { _lbl.dms(s, r5.moves); r5.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); }); }
  var r6 = _lbl.solveStage6(s); if (r6) r6.steps.forEach(function(st) { recOnly('PLL', st.explain, st.moves); });
  var r7 = _lbl.solveStage7(s); if (r7) r7.steps.forEach(function(st) { if (st.moves.length > 0) recOnly('PLL', st.explain, st.moves); });
  return { script: script, mc: mc, state: s };
};

function dFaceAllYellow(st) {
  return st.D[0]==='Y'&&st.D[1]==='Y'&&st.D[2]==='Y'&&st.D[3]==='Y'&&
         st.D[4]==='Y'&&st.D[5]==='Y'&&st.D[6]==='Y'&&st.D[7]==='Y'&&st.D[8]==='Y';

_lbl.solveOCLL = function(state) {
  if (dFaceAllYellow(state)) return {steps:[]};

  for (var di=0;di<4;di++) for (var fi=0;fi<OCLL_FORMULAS.length;fi++) {

  }

  for (var d1=0;d1<4;d1++) for (var f1=0;f1<OCLL_FORMULAS.length;f1++) {
    var m1=dS[d1].concat(OCLL_FORMULAS[f1]);

    for (var d2=0;d2<4;d2++) for (var f2=0;f2<OCLL_FORMULAS.length;f2++) {

_lbl.solve2LookPLL = function(state) {

    var cpDone = false;
    // Single T-perm
    for (var di=0;di<4&&!cpDone;di++) {
      var mv=dS[di].concat(TPERM);
      var ts=_lbl.clone(state);_lbl.dms(ts,mv);
      for(var adj=0;adj<4;adj++){if(cornersOK(ts)){
        var full=mv.slice();for(var a2=0;a2<adj;a2++)full.push('D');
        steps.push({explain:'PLL角塊排列',moves:full});_lbl.dms(state,full);cpDone=true;break;}
        _lbl.dm(ts,'D');
      }
    }
    // Double T-perm
    if (!cpDone) {
      for(var d1=0;d1<4&&!cpDone;d1++) for(var d2=0;d2<4&&!cpDone;d2++){
        var m2=dS[d1].concat(TPERM).concat(dS[d2]).concat(TPERM);
        var ts2=_lbl.clone(state);_lbl.dms(ts2,m2);
        for(var adj2=0;adj2<4;adj2++){if(cornersOK(ts2)){
          for(var a3=0;a3<adj2;a3++)m2.push('D');
          steps.push({explain:'PLL角塊排列(雙T)',moves:m2});_lbl.dms(state,m2);cpDone=true;break;}
          _lbl.dm(ts2,'D');
        }
      }
    }
  }
  
  // EP: forward-check 4 formulas × 4 D-setups
  if (!allBottomOK(state)) {
    var epDone = false;
    for(var di2=0;di2<4&&!epDone;di2++) for(var fi=0;fi<EP_FORMULAS.length&&!epDone;fi++){
      var mv3=dS[di2].concat(EP_FORMULAS[fi]);
      var ts3=_lbl.clone(state);_lbl.dms(ts3,mv3);
      for(var adj3=0;adj3<4;adj3++){if(allBottomOK(ts3)){
        for(var a4=0;a4<adj3;a4++)mv3.push('D');
        steps.push({explain:'PLL邊塊排列',moves:mv3});_lbl.dms(state,mv3);epDone=true;break;}
        _lbl.dm(ts3,'D');
      }
    }
  }
  
  // Final D-adjust
  for(var fd=0;fd<4;fd++){
    if(allBottomOK(state))break;
    _lbl.dm(state,'D');steps.push({explain:'最終對齊',moves:['D']});
  }
  
  return{steps:steps};
};

// ================================================================
// Override cfopEngine to use OCLL + 2-Look PLL
// ================================================================
_lbl.cfopEngine = function(init) {
  var s = _lbl.clone(init), script = [], mc = 0;
  function recOnly(stage, explain, moves) {
    if (!moves || !moves.length) return;
    var opt=optimizeMoves(moves);if(!opt.length)return;script.push({stage:stage,explain:explain,moves:opt});mc+=opt.length;
  }

  // Cross (IDDFS)
  var r1 = _lbl.solveCrossIDDFS(s);
  if (r1) r1.steps.forEach(function(st) { recOnly('Cross', st.explain, st.moves); });

  // F2L v2 (Smart Extract + Translated Formulas)
  var rF = _lbl.solveCFOPF2L(s);
  if (rF) rF.steps.forEach(function(st) { recOnly('F2L', st.explain, st.moves); });

  // OLL Step 1: Yellow cross (S4)
  var r4 = _lbl.solveStage4(s);
  if (r4) r4.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); });

  // OLL Step 2: Corner orientation (OCLL)
  var rOCLL = _lbl.solveOCLL(s);
  if (rOCLL) rOCLL.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); });

  // PLL: 2-Look (CP + EP)
  var rPLL = _lbl.solve1LookPLL(s);
  if (rPLL) rPLL.steps.forEach(function(st) { recOnly('PLL', st.explain, st.moves); });

  // Peephole: optimize across stage boundaries (D D' → [], R R' → [], etc.)
  var allM=[],bounds=[];
  script.forEach(function(st){bounds.push({stage:st.stage,explain:st.explain,start:allM.length});allM=allM.concat(st.moves);bounds[bounds.length-1].end=allM.length;});
  var opt=optimizeMoves(allM);
  // Rebuild script with optimized moves
  if(opt.length<allM.length){
    var newScript=[],pos=0;
    for(var bi=0;bi<bounds.length;bi++){
      var b=bounds[bi];
      var origLen=b.end-b.start;
      var ratio=origLen/Math.max(allM.length,1);
      var newEnd=Math.min(Math.round(pos+ratio*opt.length),opt.length);
      if(bi===bounds.length-1)newEnd=opt.length;
      var chunk=opt.slice(pos,newEnd);
      if(chunk.length>0)newScript.push({stage:b.stage,explain:b.explain,moves:chunk});
      pos=newEnd;
    }
    script=newScript;
  }
  mc=opt.length;

  return { script: script, mc: mc, state: s };
};

// ================================================================
// CFOP Cross: In-place IDDFS (保證 8 步以內，平均 ~6 步)
// ================================================================
_lbl.solveCrossIDDFS = function(initState) {
  var MOVES = ['U',"U'","U2",'D',"D'","D2",'R',"R'","R2",'L',"L'","L2",'F',"F'","F2",'B',"B'","B2"];
  var UNDOS = ["U'",'U',"U2","D'",'D',"D2","R'",'R',"R2","L'",'L',"L2","F'",'F',"F2","B'",'B',"B2"];
  var FGRP = [0,0,0,1,1,1,2,2,2,3,3,3,4,4,4,5,5,5];
  var OPP = {0:1,1:0,2:3,3:2,4:5,5:4};

  var s = _lbl.clone(initState);
  var solution = [];

  function heuristic() {
    var h = 0;
    if (!(s.U[7]==='W'&&s.F[1]==='R')) h++;
    if (!(s.U[5]==='W'&&s.R[1]==='B')) h++;
    if (!(s.U[1]==='W'&&s.B[1]==='O')) h++;
    if (!(s.U[3]==='W'&&s.L[1]==='G')) h++;
    return h;
  }

  function dfs(depth, lastF, lastLF) {
    var h = heuristic();
    if (h === 0) return true;
    if (h > depth) return false;
    if (depth === 0) return false;

    for (var i = 0; i < 18; i++) {
      var f = FGRP[i];
      if (f === lastF) continue;
      if (f === lastLF && OPP[f] === lastF) continue;
      if (OPP[f] === lastF && f > lastF) continue;

      _lbl.dm(s, MOVES[i]);
      if (dfs(depth - 1, f, lastF)) {
        solution.unshift(MOVES[i]);
        _lbl.dm(s, UNDOS[i]);
        return true;
      }
      _lbl.dm(s, UNDOS[i]);
    }
    return false;
  }

  for (var maxD = 0; maxD <= 8; maxD++) {
    solution = [];
    if (dfs(maxD, -1, -1)) {
      _lbl.dms(initState, solution);
      return {steps: [{explain: '白色十字('+solution.length+'步)', moves: solution}]};
    }
  }

  return _lbl.solveStage1(initState);
};

// ================================================================
// 1-Look PLL: 21 formulas + forward-checking (avg 15 steps)
// ================================================================
var PLL_21 = [
  ["R'","D","R'","D'","R'","D'","R'","D","R","D","R2"],
  ["R2","D'","R'","D'","R","D","R","D","R","D'","R"],
  ["R2","D2","R'","D2","R2","D2","R2","D2","R'","D2","R2"],
  ["R","D","R'","D","R'","D'","R'","D","R","D'","R'","D'","R2","D","R"],
  ["R","F'","R","B2","R'","F","R","B2","R2"],
  ["R2","B2","R'","F'","R","B2","R'","F","R'"],
  ["R'","B","R","F'","R'","B'","R","F","R'","B'","R","F'","R'","B","R","F"],
  ["R'","D'","R","D","R","F'","R2","D","R","D","R'","D'","R","F"],
  ["R'","D'","R","F","R'","D'","R","D","R","F'","R2","D","R"],
  ["L","D","L'","F'","L","D","L'","D'","L'","F","L2","D'","L'"],
  ["R","D2","R'","D2","R","F'","R'","D'","R","D","R","F","R2"],
  ["L'","D2","L","D2","L'","F","L","D","L'","D'","L'","F'","L2"],
  ["R","D","F","R'","D'","R","D","R","F'","R2","D","R","D","R'","D'","R","D'","R'"],
  ["R","D'","R","D","B","R","B2","D","B","D'","B","R'","B'","R'"],
  ["F'","R'","D","R","D","R'","D'","R","F","R'","D'","R","D","R","F'","R'","F"],
  ["R'","D'","R","D'","R'","D'","R","F","R'","D'","R","D","R","F'","R2","D","R","D2","R'","D","R"],
  ["R","D'","R","F'","R'","F","R'","D","R","F","D'","F'","R'","D'","R","D","R'"],
  ["R2","D'","R","D'","R","D","R'","D","R2","D","U'","R","D'","R'","U"],
  ["R","D","R'","D'","U","R2","D'","R","D'","R'","D","R'","D","R2","U'"],
  ["R2","D","R'","D","R'","D'","R","D'","R2","D'","U","R'","D","R","U'"],
  ["R'","D'","R","D","U'","R2","D","R'","D","R","D'","R","D'","R2","U"]
];

_lbl.solve1LookPLL = function(state) {
  var dS = [[], ['D'], ['D2'], ["D'"]];
  function allOK(st) {
    return ['F','R','B','L'].every(function(f){
      return st[f][6]===st[f][4]&&st[f][7]===st[f][4]&&st[f][8]===st[f][4];
    });
  }
  if (allOK(state)) return {steps:[]};
  
  for (var di = 0; di < 4; di++) {
    for (var pi = 0; pi < PLL_21.length; pi++) {
      var mv = dS[di].concat(PLL_21[pi]);
      var ts = _lbl.clone(state); _lbl.dms(ts, mv);
      for (var adj = 0; adj < 4; adj++) {
        if (allOK(ts)) {
          var full = mv.slice(); for (var a = 0; a < adj; a++) full.push('D');
          _lbl.dms(state, full);
          return {steps: [{explain:'PLL(1-Look)', moves:full}]};
        }
        _lbl.dm(ts, 'D');
      }
    }
  }
  // Fallback to 2-Look
  return _lbl.solve2LookPLL(state);
};

function doCFOPSolve(){
  try{if(vid&&vid.srcObject){vid.srcObject.getTracks().forEach(t=>t.stop());vid.srcObject=null;}}catch(e){}
  if(vid)vid.style.display='none';
  document.querySelector('.wrap').style.background='#000';

  document.getElementById('botBar').style.display='block';

  document.getElementById('info').textContent='🧩 CFOP 計算中...';
  document.getElementById('btnRow').innerHTML='';
  setTimeout(function(){
    try{
      var initState={};
      ['U','R','F','D','L','B'].forEach(function(f){initState[f]=faceColors[f].slice();});
      var result=_lbl.cfopEngine(window._bridgedState?_lbl.clone(window._bridgedState):initState);
      var solved=_lbl.solved(),ok=true;
      ['U','R','F','D','L','B'].forEach(function(f){for(var i=0;i<9;i++){if(result.state[f][i]!==solved[f][i])ok=false;}});
      if(!ok){
        document.getElementById('info').innerHTML='<span style="color:#FFA500">CFOP 引擎無法還原，請嘗試 Kociemba 模式或手動修正</span>';
        showEditableFaces();
        document.getElementById('btnRow').innerHTML='<button class="btn" onclick="showModeSelect()">🧩 重新選擇</button>';
        return;
      }
      solution=[];
      window._lblStageMarkers=[];
      var idx=0;
      result.script.forEach(function(seg){
        window._lblStageMarkers.push({idx:idx,stage:seg.stage,explain:seg.explain});
        seg.moves.forEach(function(mv){solution.push(mv);idx++;});
      });
      // Compute energy per step
      var tmpState={};['U','R','F','D','L','B'].forEach(function(f){tmpState[f]=faceColors[f].slice();});
      window._energyAtStep={};window._initialEnergy=_lbl.getEnergyScore?_lbl.getEnergyScore(tmpState):1000;
      for(var si=0;si<solution.length;si++){
        _lbl.dm(tmpState,solution[si]);
        window._energyAtStep[si]=_lbl.getEnergyScore?_lbl.getEnergyScore(tmpState):0;
      }
      document.getElementById('info').innerHTML='✅ CFOP 求解成功！'+solution.length+' 步';
      showFacePreviews('mgrid');
      document.getElementById('btnRow').innerHTML='<button class="btn" onclick="beginSolve()">📚 開始學習 ('+solution.length+' 步)</button>';
    }catch(e){
      document.getElementById('info').innerHTML='<span style="color:#E94560">CFOP 錯誤: '+e.message+'</span>';
      document.getElementById('btnRow').innerHTML='<button class="btn" onclick="showModeSelect()">🧩 重新選擇</button>';
    }
  },200);
}

// === miniArrowSVG: returns <img> from MOVE_IMGS ===
function miniArrowSVG(mv){
  var src=MOVE_IMGS[mv];
  if(!src) return '<span style="font-size:20px;font-weight:900;color:#FFD700;font-family:monospace">'+mv+'</span>';

}

var CORNER_HOMES=[{c1:'W',c2:'R',c3:'B',f1:'U',p1:8,f2:'F',p2:2,f3:'R',p3:0},{c1:'W',c2:'R',c3:'G',f1:'U',p1:6,f2:'F',p2:0,f3:'L',p3:2},{c1:'W',c2:'O',c3:'B',f1:'U',p1:2,f2:'B',p2:0,f3:'R',p3:2},{c1:'W',c2:'O',c3:'G',f1:'U',p1:0,f2:'B',p2:2,f3:'L',p3:0},{c1:'Y',c2:'R',c3:'B',f1:'D',p1:2,f2:'F',p2:8,f3:'R',p3:6},{c1:'Y',c2:'R',c3:'G',f1:'D',p1:0,f2:'F',p2:6,f3:'L',p3:8},{c1:'Y',c2:'O',c3:'B',f1:'D',p1:8,f2:'B',p2:6,f3:'R',p3:8},{c1:'Y',c2:'O',c3:'G',f1:'D',p1:6,f2:'B',p2:8,f3:'L',p3:6}];

_lbl.getEnergyScore=function(state){var energy=0;
  EDGE_HOMES.forEach(function(h){if(state[h.f1][h.p1]===h.c1&&state[h.f2][h.p2]===h.c2)return;var piece=_lbl.findEdge(state,h.c1,h.c2);if(!piece)return;var hL=h.f1==='U'?'U':(h.f1==='D'?'D':'E');energy+=(piece.layer===hL)?20:50;if(hL==='U'&&piece.layer==='U'){var pp={UF:7,UR:5,UB:1,UL:3}[piece.slot];if(pp!==undefined&&state.U[pp]!==h.c1)energy+=30;}if(hL==='D'&&piece.layer==='D'){var pp2={DF:1,DR:5,DB:7,DL:3}[piece.slot];if(pp2!==undefined&&state.D[pp2]!==h.c1)energy+=30;}});
  CORNER_HOMES.forEach(function(h){if(state[h.f1][h.p1]===h.c1&&state[h.f2][h.p2]===h.c2&&state[h.f3][h.p3]===h.c3)return;var piece=_lbl.findCorner(state,h.c1,h.c2,h.c3);if(!piece)return;var hL=h.f1==='U'?'U':'D';energy+=(piece.layer===hL)?20:50;if(piece.layer==='U'){var pp={UFR:8,UFL:6,UBR:2,UBL:0}[piece.slot];if(pp!==undefined&&state.U[pp]!==h.c1)energy+=30;}if(piece.layer==='D'){var pp2={DFR:2,DFL:0,DBR:8,DBL:6}[piece.slot];if(pp2!==undefined&&state.D[pp2]!==h.c1)energy+=30;}});
  return energy;
};

function classifySpell(stage,explain){
  if(stage==='Cross')return{name:'白色十字',icon:'✚',type:'吸入咒',typeIcon:'🧲'};
  if(explain.indexOf('踢出')>=0)return{name:'地洞脫逃',icon:'🕳️',type:'吸入咒',typeIcon:'🧲'};
  if(explain.indexOf('F2L')>=0||explain.indexOf('好朋友')>=0)return{name:'好朋友回家',icon:'🏠',type:'吸入咒',typeIcon:'🧲'};
  if(explain.indexOf('黃色十字')>=0)return{name:'十字咒',icon:'✚',type:'翻轉咒',typeIcon:'🔄'};
  if(explain.indexOf('OLL')>=0||explain.indexOf('角塊方向')>=0)return{name:'小魚咒',icon:'🐟',type:'翻轉咒',typeIcon:'🔄'};
  if(explain.indexOf('PLL')>=0)return{name:'大搬家',icon:'🏗️',type:'換位咒',typeIcon:'🔀'};
  return{name:explain,icon:'🔮',type:'基礎',typeIcon:'⚙️'};
}

var OLL_SIGMAP={};
(function(){
  function rv(moves){return moves.slice().reverse().map(function(m){if(m.indexOf("'")>-1)return m.replace("'","");if(m.indexOf("2")>-1)return m;return m+"'";});}
  function enc(s){var sig='';for(var i=0;i<9;i++)sig+=s.D[i]==='Y'?'1':'0';['F','R','B','L'].forEach(function(f){for(var i=6;i<=8;i++)sig+=s[f][i]==='Y'?'1':'0';});return sig;}
  OLL_DB.forEach(function(oll){
    var s=_lbl.solved();_lbl.dms(s,rv(oll.moves));
    for(var auf=0;auf<4;auf++){
      var sig=enc(s);
      if(!OLL_SIGMAP[sig])OLL_SIGMAP[sig]={id:oll.id,nick:oll.nick,auf:auf};
      _lbl.dm(s,'D');
    }
  });
})();

// --- Progress (localStorage) ---
var TRAIN_KEY='magic_cfop_v3';
function loadProgress(){try{return JSON.parse(localStorage.getItem(TRAIN_KEY))||{};}catch(e){return {};}}
function saveProgress(p){try{localStorage.setItem(TRAIN_KEY,JSON.stringify(p));}catch(e){}}
function recordAttempt(id,correct){var p=loadProgress();if(!p[id])p[id]={c:0,t:0,s:0,b:0};p[id].t++;if(correct){p[id].c++;p[id].s++;if(p[id].s>p[id].b)p[id].b=p[id].s;}else p[id].s=0;saveProgress(p);}
function isMastered(id){var p=loadProgress(),r=p[id];return r&&r.t>=5&&r.c/r.t>=0.8&&r.s>=3;}
function getStats(id){var p=loadProgress(),r=p[id];if(!r||!r.t)return null;return{acc:Math.round(r.c/r.t*100),total:r.t,streak:r.s,best:r.b};}

// --- OLL Pattern Detection ---
function encodeOLLSig(state){
  var sig='';for(var i=0;i<9;i++)sig+=state.D[i]==='Y'?'1':'0';
  ['F','R','B','L'].forEach(function(f){for(var i=6;i<=8;i++)sig+=state[f][i]==='Y'?'1':'0';});
  return sig;
}
function detectOLL(state){
  var s=_lbl.clone(state);
  for(var rot=0;rot<4;rot++){
    var sig=encodeOLLSig(s);
    if(OLL_SIGMAP[sig])return{oll:OLL_DB.find(function(o){return o.id===OLL_SIGMAP[sig].id;}),auf:rot,sig:sig};
    _lbl.dm(s,'D');
  }
  return null;
}

// --- Draw D-face pattern SVG ---
function drawDFaceSVG(state,size){
  size=size||130;var cs=size/5;var pad=(size-cs*3)/2;
  var svg='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
  // Side stickers (thin strips around the grid)
  var sides={F:[state.F[6],state.F[7],state.F[8]],R:[state.R[6],state.R[7],state.R[8]],B:[state.B[6],state.B[7],state.B[8]],L:[state.L[6],state.L[7],state.L[8]]};
  var sidePos={F:[[pad,pad+cs*3+2,cs,8]],R:[[pad+cs*3+2,pad,8,cs]],B:[[pad,pad-10,cs,8]],L:[[pad-10,pad,8,cs]]};
  // F side (bottom)
  for(var i=0;i<3;i++){var c=sides.F[i]==='Y'?'#FFD500':'#333';svg+='<rect x="'+(pad+i*cs)+'" y="'+(pad+cs*3+3)+'" width="'+(cs-1)+'" height="7" rx="2" fill="'+c+'" opacity=".7"/>';}
  // R side (right)
  for(var i=0;i<3;i++){var c=sides.R[i]==='Y'?'#FFD500':'#333';svg+='<rect x="'+(pad+cs*3+3)+'" y="'+(pad+i*cs)+'" width="7" height="'+(cs-1)+'" rx="2" fill="'+c+'" opacity=".7"/>';}
  // B side (top)
  for(var i=0;i<3;i++){var c=sides.B[2-i]==='Y'?'#FFD500':'#333';svg+='<rect x="'+(pad+i*cs)+'" y="'+(pad-10)+'" width="'+(cs-1)+'" height="7" rx="2" fill="'+c+'" opacity=".7"/>';}
  // L side (left)
  for(var i=0;i<3;i++){var c=sides.L[2-i]==='Y'?'#FFD500':'#333';svg+='<rect x="'+(pad-10)+'" y="'+(pad+i*cs)+'" width="7" height="'+(cs-1)+'" rx="2" fill="'+c+'" opacity=".7"/>';}
  // D face 3×3
  for(var r=0;r<3;r++)for(var col=0;col<3;col++){
    var idx=r*3+col,color=state.D[idx]==='Y'?'#FFD500':'#444';
    svg+='<rect x="'+(pad+col*cs)+'" y="'+(pad+r*cs)+'" width="'+(cs-1)+'" height="'+(cs-1)+'" rx="4" fill="'+color+'" stroke="rgba(255,255,255,.15)" stroke-width=".5"/>';
  }
  svg+='</svg>';return svg;
}

// --- Generate OLL state from reverse formula ---
function genOLLState(ollId){
  var oll=OLL_DB.find(function(o){return o.id===ollId;});if(!oll)return null;
  var s=_lbl.solved();
  var rev=oll.moves.slice().reverse().map(function(m){if(m.indexOf("'")>-1)return m.replace("'","");if(m.indexOf("2")>-1)return m;return m+"'";});
  _lbl.dms(s,rev);
  // Random AUF
  var aufs=[[],['D'],['D2'],["D'"]];
  _lbl.dms(s,aufs[Math.floor(Math.random()*4)]);
  return s;
}

// === Parity validation (run inside main thread using facelet string) ===
function buildFaceletString(fc){
  var fl='';['U','R','F','D','L','B'].forEach(function(f){fc[f].forEach(function(c){fl+=C2F[c]||'?';});});return fl;
}
function validateAndFix(fl,cb){
  // Send to worker for parity check
  var origCB=solverCB;
  solverCB=function(err,sol){
    // This won't be called for validate - we listen via onmessage override
  };
  var handler=function(e){
    if(e.data.t!=='valid')return;
    solverWorker.removeEventListener('message',handler);
    if(e.data.ok){cb(null,fl);return;}
    // Parity failed → try brute-force swap fix
    var arr=fl.split('');
    for(var i=0;i<54;i++){
      if(i%9===4)continue;
      for(var j=i+1;j<54;j++){
        if(j%9===4)continue;
        if(arr[i]===arr[j])continue;
        var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
        var testFL=arr.join('');
        // Quick check: each color still 9?
        var cnt={};for(var k=0;k<54;k++){cnt[testFL[k]]=(cnt[testFL[k]]||0)+1;}
        var colorOK=true;for(var c in cnt){if(cnt[c]!==9)colorOK=false;}
        if(colorOK){
          // Send to worker for validation
          var found=false;
          var handler2=function(e2){
            if(e2.data.t!=='valid')return;
            solverWorker.removeEventListener('message',handler2);
            if(e2.data.ok&&!found){found=true;cb(null,testFL,i,j);return;}
            if(!found){arr[j]=arr[i];arr[i]=tmp;continueSearch();}
          };
          solverWorker.addEventListener('message',handler2);
          solverWorker.postMessage({t:'validate',fl:testFL});
          return;
        }
        arr[j]=arr[i];arr[i]=tmp;
      }
    }
    cb('unfixable');
  };
  solverWorker.addEventListener('message',handler);
  solverWorker.postMessage({t:'validate',fl:fl});
}
// Synchronous brute-force (simpler - run validation in main thread using cubejs in worker)
function attemptAutoFixSync(fl){
  // We can't run cubejs in main thread. Use a simpler heuristic:
  // Try all 1431 swaps, for each one send to worker and check.
  // But this would be async. Instead, let's do it all in the worker.
  return null;
}

function bruteForceFixInWorker(fl,initState){
  // Build all candidate swaps and test them in batches via worker
  var arr=fl.split('');
  var candidates=[];
  for(var i=0;i<54;i++){
    if(i%9===4)continue;
    for(var j=i+1;j<54;j++){
      if(j%9===4)continue;
      if(arr[i]===arr[j])continue;
      // Quick: swap must keep each color at 9
      candidates.push([i,j]);
    }
  }
  
  var ci=0;
  function tryNext(){
    if(ci>=candidates.length){
      // All failed
      showScanError();
      return;
    }
    var pair=candidates[ci];ci++;
    var a=arr.slice();
    var tmp=a[pair[0]];a[pair[0]]=a[pair[1]];a[pair[1]]=tmp;
    var testFL=a.join('');
    // Check color counts
    var cnt={};for(var k=0;k<54;k++){cnt[testFL[k]]=(cnt[testFL[k]]||0)+1;}
    var ok=true;for(var c in cnt){if(cnt[c]!==9)ok=false;}
    if(!ok){tryNext();return;}
    
    var h=function(e){
      if(e.data.t!=='valid')return;
      solverWorker.removeEventListener('message',h);
      if(e.data.ok){
        // Fixed! Update faceColors from the fixed facelet string
        var F2C={U:'W',R:'B',F:'R',D:'Y',L:'G',B:'O'};
        var faces=['U','R','F','D','L','B'];
        for(var fi=0;fi<6;fi++){
          for(var si=0;si<9;si++){
            faceColors[faces[fi]][si]=F2C[testFL[fi*9+si]];
          }
        }
        ['U','R','F','D','L','B'].forEach(function(f){cubeState[f]=faceColors[f].slice();});
        var newInit={};['U','R','F','D','L','B'].forEach(function(f){newInit[f]=faceColors[f].slice();});
        var ui=setupTrainUI();
        ui.innerHTML='<div style="padding:20px;text-align:center"><div style="color:#00E676;font-size:16px;font-weight:900;margin-bottom:4px">✅ 自動修正成功！</div><div style="font-size:11px;color:rgba(255,255,255,.4)">修正了位置 '+pair[0]+' 和 '+pair[1]+' 的顏色</div></div>';
        setTimeout(function(){
          ui.innerHTML='<div style="padding:20px;text-align:center;color:#FFD700;font-size:16px;font-weight:900">🧩 CFOP 計算中...</div>';
          setTimeout(function(){runCFOPGuided(newInit);},50);
        },1200);
      }else{
        tryNext();
      }
    };
    solverWorker.addEventListener('message',h);
    solverWorker.postMessage({t:'validate',fl:testFL});
  }
  tryNext();
}

function runCFOPGuided(initState){
  try{
    var result=_lbl.cfopEngine(window._bridgedState?_lbl.clone(window._bridgedState):_lbl.clone(initState));
    var sv=_lbl.solved(),ok=true;
    ['U','R','F','D','L','B'].forEach(function(f){for(var i=0;i<9;i++){if(result.state[f][i]!==sv[f][i])ok=false;}});
    if(!ok){showScanError();return;}
    var stages=[],curStage=null;
    result.script.forEach(function(seg){
      if(!curStage||curStage.name!==seg.stage){curStage={name:seg.stage,steps:[],totalMoves:0};stages.push(curStage);}
      curStage.steps.push(seg);curStage.totalMoves+=seg.moves.length;
    });
    showCFOPStageSelect(initState,result,stages);
  }catch(e){
    showMsg('❌ 錯誤',e.message,'showTrainingMenu()','← 返回');
  }
}

  if(!result||!initState){showMsg('❌','請重新開始','startCFOPGuided()','🔄 重試');return;}
  // Use existing solve UI with CFOP stages
  solveMode='cfop';
  solution=[];
  window._lblStageMarkers=[];
  var idx=0;
  result.script.forEach(function(seg){
    window._lblStageMarkers.push({idx:idx,stage:seg.stage,explain:seg.explain});
    seg.moves.forEach(function(mv){solution.push(mv);idx++;});
  });
  // Energy
  var tmpState={};['U','R','F','D','L','B'].forEach(function(f){tmpState[f]=initState[f].slice();});
  window._energyAtStep={};window._initialEnergy=_lbl.getEnergyScore?_lbl.getEnergyScore(tmpState):1000;

  }
  // Reset faceColors to initState for solving
  ['U','R','F','D','L','B'].forEach(function(f){faceColors[f]=initState[f].slice();cubeState[f]=initState[f].slice();});
  // CRITICAL: restore solve UI DOM (training menu overwrites it)

function trainCross(){
  var s={};['U','R','F','D','L','B'].forEach(function(f){s[f]=faceColors[f].slice();});
  if(_lbl.crossOK(s)){showMsg('✅ Cross 已完成！','白色十字已做好','trainF2L()','➡️ F2L');return;}
  var r=_lbl.solveCrossIDDFS(_lbl.clone(s));
  if(!r||!r.steps.length){showMsg('❌','找不到Cross解法');return;}
  var moves=[];r.steps.forEach(function(st){moves=moves.concat(st.moves);});
  showGuidedPractice('Cross ✚','把4個白色邊塊送回家！',moves,s,r.steps,'Cross');
}
function trainF2L(){
  var s={};['U','R','F','D','L','B'].forEach(function(f){s[f]=faceColors[f].slice();});
  if(!_lbl.crossOK(s)){showMsg('⚠️ 先完成Cross','F2L需要白色十字','trainCross()','✚ Cross');return;}
  var r=_lbl.solveCFOPF2L(_lbl.clone(s));

// ===== OLL TRAINING (Quiz Mode) =====
function trainOLL(){
  var s={};['U','R','F','D','L','B'].forEach(function(f){s[f]=faceColors[f].slice();});
  // Solve up to OLL stage
  var cs=_lbl.clone(s);
  var r1=_lbl.solveCrossIDDFS(cs);if(r1)r1.steps.forEach(function(st){_lbl.dms(cs,st.moves);});
  var rF=_lbl.solveCFOPF2L(cs);if(rF)rF.steps.forEach(function(st){_lbl.dms(cs,st.moves);});
  var dYel=cs.D.filter(function(c){return c==='Y';}).length;
  if(dYel===9){showMsg('✅ OLL已完成！','頂面全黃了','trainPLL()','➡️ PLL');return;}
  // Detect which OLL it is
  var det=detectOLL(cs);
  if(det) showOLLQuiz(cs,det.oll);
  else showOLLQuizRandom(); // Can't detect → show random quiz
}

// ===== PROGRESS PAGE =====
function showProgressPage(){
  var ui=document.getElementById('solveUI');
  var ollMast=OLL_DB.filter(function(o){return isMastered('OLL_'+o.id);}).length;
  var pllMast=PLL_DB.filter(function(o){return isMastered('PLL_'+o.id);}).length;
  var prog=loadProgress();
  var totalAttempts=0;Object.values(prog).forEach(function(r){totalAttempts+=r.t;});
  var bestStreak=0;var bestId='';Object.entries(prog).forEach(function(e){if(e[1].b>bestStreak){bestStreak=e[1].b;bestId=e[0];}});

  var h='<div style="padding:16px;text-align:center;overflow-y:auto;height:100%;-webkit-overflow-scrolling:touch">';
  h+='<div style="font-size:17px;font-weight:900;color:#00D2FF;margin-bottom:12px">📊 我的速解之路</div>';

  // OLL progress bar
  var ollPct=Math.round(ollMast/57*100);
  h+='<div style="text-align:left;max-width:300px;margin:0 auto 14px">';
  h+='<div style="font-size:13px;font-weight:800;color:#FFD500;margin-bottom:4px">OLL 掌握度 '+ollMast+'/57 ('+ollPct+'%)</div>';
  h+='<div style="height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden"><div style="width:'+ollPct+'%;height:100%;background:linear-gradient(90deg,#FFD500,#FF6B6B);border-radius:4px"></div></div>';
  ['beginner','intermediate','advanced'].forEach(function(lv){
    var items=OLL_DB.filter(function(o){return o.level===lv;});
    var m=items.filter(function(o){return isMastered('OLL_'+o.id);}).length;
    var label=lv==='beginner'?'入門':lv==='intermediate'?'初級':'進階';
    var icon=m===items.length?'✅':m>0?'⏳':'🔒';
    h+='<div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:3px">  '+label+': '+m+'/'+items.length+' '+icon+'</div>';
  });
  h+='</div>';

  // PLL progress bar
  var pllPct=Math.round(pllMast/21*100);
  h+='<div style="text-align:left;max-width:300px;margin:0 auto 14px">';
  h+='<div style="font-size:13px;font-weight:800;color:#FF6B6B;margin-bottom:4px">PLL 掌握度 '+pllMast+'/21 ('+pllPct+'%)</div>';
  h+='<div style="height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden"><div style="width:'+pllPct+'%;height:100%;background:linear-gradient(90deg,#FF6B6B,#FFD500);border-radius:4px"></div></div>';
  ['beginner','intermediate','advanced'].forEach(function(lv){
    var items=PLL_DB.filter(function(o){return o.level===lv;});
    var m=items.filter(function(o){return isMastered('PLL_'+o.id);}).length;
    var label=lv==='beginner'?'入門':lv==='intermediate'?'初級':'進階';
    var icon=m===items.length?'✅':m>0?'⏳':'🔒';
    h+='<div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:3px">  '+label+': '+m+'/'+items.length+' '+icon+'</div>';
  });
  h+='</div>';

  // Stats
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:300px;margin:0 auto 14px">';
  h+='<div style="background:rgba(255,255,255,.05);border-radius:10px;padding:10px;text-align:center"><div style="font-size:20px;font-weight:900;color:#00D2FF">'+totalAttempts+'</div><div style="font-size:9px;color:rgba(255,255,255,.4)">總練習次</div></div>';
  h+='<div style="background:rgba(255,255,255,.05);border-radius:10px;padding:10px;text-align:center"><div style="font-size:20px;font-weight:900;color:#FFD500">'+(ollMast+pllMast)+'</div><div style="font-size:9px;color:rgba(255,255,255,.4)">已掌握</div></div>';
  h+='<div style="background:rgba(255,255,255,.05);border-radius:10px;padding:10px;text-align:center"><div style="font-size:20px;font-weight:900;color:#FF6B6B">'+bestStreak+'</div><div style="font-size:9px;color:rgba(255,255,255,.4)">最佳連勝</div></div>';
  h+='</div>';

  // Reset button
  h+='<button onclick="if(confirm(\'確定清除所有進度？\')){{localStorage.removeItem(TRAIN_KEY);showProgressPage();}}" style="background:none;border:none;color:rgba(255,255,255,.2);cursor:pointer;font-family:inherit;font-size:10px;margin-top:4px">🗑️ 清除進度</button>';
  h+='<br><button onclick="showTrainingMenu()" class="btn" style="margin-top:10px;font-size:13px;padding:8px 24px">← 返回</button>';
  h+='</div>';
  ui.innerHTML=h;
}

function showGuidedPractice(title,desc,moves,initState,steps,stage){
  solveMode='cfop';solution=moves;solveStep=-1;
  window._lblStageMarkers=[];var idx=0;
  steps.forEach(function(st){window._lblStageMarkers.push({idx:idx,stage:stage,explain:st.explain});st.moves.forEach(function(){idx++;});});
  ['U','R','F','D','L','B'].forEach(function(f){cubeState[f]=[...faceColors[f]];});
  _restoreSolveUI();
  beginSolve();
}
