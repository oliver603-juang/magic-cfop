<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:#000;color:#fff;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.wrap{position:relative;flex:1;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
canvas#ov{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.top-bar{position:absolute;top:0;left:0;right:0;z-index:10;padding:10px 16px;text-align:center;background:linear-gradient(rgba(0,0,0,.8),transparent);padding-bottom:28px}
.top-title{font-size:18px;font-weight:900;color:#FFD700}
.top-sub{font-size:12px;color:#ddd;margin-top:2px}
.top-dots{display:flex;justify-content:center;gap:5px;margin-top:6px}
.td{width:20px;height:5px;border-radius:3px;background:rgba(255,255,255,.15)}.td.done{background:#00D2FF}.td.now{background:#FFD700;width:32px}
.bot-bar{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:8px 16px 20px;background:linear-gradient(transparent,rgba(0,0,0,.9));padding-top:24px;text-align:center}

.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:78px;margin:0 auto 8px}
.mcell{height:22px;border-radius:3px;border:1px solid rgba(255,255,255,.15)}
.btn{padding:14px 32px;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;cursor:pointer;background:#FFD700;color:#000;min-width:120px}
.btn:active{transform:scale(.96);opacity:.9}
.btn-sm{padding:10px 20px;font-size:14px}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.overlay{display:none;position:absolute;inset:0;z-index:25;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92)}
.overlay.show{display:flex}
.sd{width:16px;height:16px;border-radius:4px;font-size:7px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:rgba(255,255,255,.3);font-family:monospace;font-weight:700}
.sd.now{background:#FFD700;color:#000}.sd.done{background:rgba(0,210,255,.25);color:#00D2FF}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(1);opacity:0}50%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style></head><body>
<div class="wrap">
<video id="vid" autoplay playsinline muted></video><canvas id="ov"></canvas>
<div class="top-bar" id="topBar"><div class="top-title" id="title">🧊 魔方小老師</div><div class="top-sub" id="sub"></div><div class="top-dots" id="dots"></div></div>
<div class="bot-bar" id="botBar" style="display:none"><div class="info" id="info"></div><div class="mgrid" id="mgrid" style="display:none"></div><div class="btn-row" id="btnRow"></div></div>
<div id="solveUI" onclick="var x=event.clientX;var w=window.innerWidth;if(x>w*0.5)nextMove();else prevMove();" style="display:none;cursor:pointer;position:absolute;inset:0;z-index:10;background:#000;flex-direction:column;overflow:hidden">
 <div style="flex-shrink:0;padding:2px 6px;text-align:center">
  <div id="stageLabel"></div>
  <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0">
   <div style="text-align:center"><div style="font-size:7px;color:rgba(255,255,255,.25)">操作前</div><div class="mgrid" id="beforeGrid" style="display:grid;width:48px;grid-template-columns:repeat(3,1fr);gap:1px;margin:1px auto"></div></div>
   <div style="text-align:center;min-width:45px"><div style="font-size:26px;font-weight:900;color:#FFD700;font-family:monospace;line-height:1" id="sMoveLabel">-</div><div style="font-size:9px;color:#ddd" id="sMoveDesc">-</div></div><div id="arrowDiagram" style="flex-shrink:0"></div>
  </div>
  <div id="formulaStrip" style="display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:340px;margin:2px auto"></div>
  <div style="font-size:8px;color:rgba(255,255,255,.3)" id="sMoveProg"></div>
 </div>
 <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-top:1px solid rgba(255,255,255,.06);padding:2px">
  <div id="afterGrid" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></div>
 </div>
 <div id="sBtnRow" style="display:none"></div>
 <div id="sMoveVis" style="display:none"></div>
</div>
<div class="overlay show" id="startOv">
 <div style="font-size:48px;margin-bottom:8px">🧊</div>
 <div style="font-size:24px;font-weight:900;color:#FFD700">魔方小老師</div>
 <div style="font-size:15px;font-weight:800;color:#00D2FF;margin-top:2px">CFOP v3 速解法</div>
 <div style="font-size:13px;color:rgba(255,255,255,.5);margin-top:10px;max-width:280px;text-align:center;line-height:1.6">📸 拍攝6面 → 🧩 CFOP 速解 · 平均72步<br>全程白色朝上！適合初學者</div>
 <button class="btn" style="margin-top:20px;font-size:18px;padding:16px 40px" onclick="startApp()">📸 開始掃描</button>
 <button class="btn btn-sm" style="margin-top:10px;background:rgba(255,255,255,.12);color:#ccc" onclick="startManual()">✏️ 手動輸入顏色</button>
</div>

 <div style="font-size:64px">🎉</div>
 <div style="font-size:24px;font-weight:900;color:#00D2FF;margin-top:8px">魔方還原完成！</div>
 <div style="font-size:14px;color:rgba(255,255,255,.5);margin-top:4px">太厲害了！你做到了！</div>
 <button class="btn" style="margin-top:16px" onclick="location.reload()">再來一次</button>
</div>
</div>
<script>
// ===== CONSTANTS =====
const SCAN_SEQ=[
  {f:'F',name:'前（紅）',guide:'上白朝天，前紅對鏡頭'},
  {f:'R',name:'右（藍）',guide:'順時針轉90°，右藍對鏡頭'},
  {f:'B',name:'後（橘）',guide:'再轉90°，後橘對鏡頭'},
  {f:'L',name:'左（綠）',guide:'再轉90°，左綠對鏡頭'},
  {f:'U',name:'上（白）',guide:'轉回前紅，往前傾，上白對鏡頭'},
  {f:'D',name:'下（黃）',guide:'往後傾180°，下黃對鏡頭'},
];
const CMAP={W:'#FFFFFF',R:'#B71234',B:'#0046AD',O:'#FF5800',G:'#009B48',Y:'#FFD500'};
const CC={F:'R',R:'B',B:'O',L:'G',U:'W',D:'Y'};
const C2F={W:'U',B:'R',R:'F',Y:'D',G:'L',O:'B'};
const FLABEL={U:'上白',R:'右藍',F:'前紅',D:'下黃',L:'左綠',B:'後橘'};
const MDESC_KID={};
MDESC_KID['R']='右邊 推上去 ⬆';MDESC_KID["R'"]='右邊 拉下來 ⬇';MDESC_KID['R2']='右邊 推兩次 ⬆⬆';
MDESC_KID['U']='上面 往左推 ⬅';MDESC_KID["U'"]='上面 往右推 ➡';MDESC_KID['U2']='上面 轉半圈';
MDESC_KID['D']='下面 往右推 ➡';MDESC_KID["D'"]='下面 往左推 ⬅';MDESC_KID['D2']='下面 轉半圈';
MDESC_KID['L']='左邊 拉下來 ⬇';MDESC_KID["L'"]='左邊 推上去 ⬆';MDESC_KID['L2']='左邊 推兩次';
MDESC_KID['F']='正面 順時針轉 ↻';MDESC_KID["F'"]='正面 逆時針轉 ↺';MDESC_KID['F2']='正面 轉半圈';
MDESC_KID['B']='後面 順時針轉 ↻';MDESC_KID["B'"]='後面 逆時針轉 ↺';MDESC_KID['B2']='後面 轉半圈';
window.CN={W:'白',B:'藍',R:'紅',Y:'黃',G:'綠',O:'橘'};

let vid,ov,octx;
let rawData={},faceColors={},cubeState={};
let scanIdx=0,solution=[],solveStep=-1;
let mode='start';

// ===== CAMERA =====
async function startApp(){
  document.getElementById('startOv').classList.remove('show');
  vid=document.getElementById('vid');ov=document.getElementById('ov');octx=ov.getContext('2d');
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
    vid.srcObject=s;await vid.play();
    ov.width=vid.videoWidth||720;ov.height=vid.videoHeight||1280;
    mode='scan';scanIdx=0;showScanUI();
  }catch(e){alert('相機錯誤: '+e.message);}
}
function startManual(){
  document.getElementById('startOv').classList.remove('show');
  document.getElementById('startOv').style.display='none';
  document.querySelector('.wrap').style.background='#000';
  if(vid)vid.style.display='none';
  ['U','R','F','D','L','B'].forEach(f=>{faceColors[f]=['W','W','W','W',CC[f],'W','W','W','W'];});
  // Set centers correctly
  faceColors.U[4]='W';faceColors.R[4]='B';faceColors.F[4]='R';faceColors.D[4]='Y';faceColors.L[4]='G';faceColors.B[4]='O';
  document.getElementById('topBar').style.display='block';
  document.getElementById('botBar').style.display='block';
  document.getElementById('title').textContent='✏️ 手動輸入';
  document.getElementById('sub').textContent='點擊格子切換顏色，中心格不能改';
  document.getElementById('info').textContent='完成後按下方按鈕';
  showEditableFaces();
  document.getElementById('btnRow').innerHTML='<button class="btn" onclick="doManualSolve()">🧩 LBL 解題！</button>';
}
function showScanUI(){
  const info=SCAN_SEQ[scanIdx];
  document.getElementById('title').textContent=info.name;
  document.getElementById('sub').textContent=info.guide;
  document.getElementById('dots').innerHTML=SCAN_SEQ.map((_,i)=>'<div class="td'+(i<scanIdx?' done':'')+(i===scanIdx?' now':'')+'"></div>').join('');
  document.getElementById('botBar').style.display='block';
  document.getElementById('info').textContent='對準框框後按下拍照';
  document.getElementById('mgrid').style.display='none';
  document.getElementById('btnRow').innerHTML='<button class="btn" onclick="doScanCapture()">📸 拍照</button>';
  drawGuideGrid();
}
function drawGuideGrid(){
  if(!ov||!ov.width)return;
  const vw=ov.width,vh=ov.height;octx.clearRect(0,0,vw,vh);
  const gs=Math.min(vw,vh)*0.82,cs=gs/3,sx=(vw-gs)/2,sy=(vh-gs)/2;
  octx.fillStyle='rgba(0,0,0,.25)';
  octx.fillRect(0,0,vw,sy);octx.fillRect(0,sy+gs,vw,vh-sy-gs);octx.fillRect(0,sy,sx,gs);octx.fillRect(sx+gs,sy,vw-sx-gs,gs);
  octx.strokeStyle='rgba(255,215,0,.5)';octx.lineWidth=1.5;
  for(let i=0;i<=3;i++){octx.beginPath();octx.moveTo(sx+i*cs,sy);octx.lineTo(sx+i*cs,sy+gs);octx.stroke();octx.beginPath();octx.moveTo(sx,sy+i*cs);octx.lineTo(sx+gs,sy+i*cs);octx.stroke();}
  octx.strokeStyle='#FFD700';octx.lineWidth=3;
  [[sx,sy],[sx+gs,sy],[sx,sy+gs],[sx+gs,sy+gs]].forEach(([x,y])=>{const dx=x===sx?1:-1,dy=y===sy?1:-1;octx.beginPath();octx.moveTo(x+14*dx,y);octx.lineTo(x,y);octx.lineTo(x,y+14*dy);octx.stroke();});
}
function doScanCapture(){
  if(!vid.videoWidth)return;
  const vw=vid.videoWidth,vh=vid.videoHeight,tc=document.createElement('canvas');tc.width=vw;tc.height=vh;
  const tctx=tc.getContext('2d');tctx.drawImage(vid,0,0,vw,vh);
  const gs=Math.min(vw,vh)*0.82,cs=gs/3,sx=(vw-gs)/2,sy=(vh-gs)/2;
  let rgbs=[];
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
    const px=Math.round(sx+(c+.5)*cs),py=Math.round(sy+(r+.5)*cs);
    const d=tctx.getImageData(px-5,py-5,11,11);let rr=0,gg=0,bb=0;
    for(let i=0;i<d.data.length;i+=4){rr+=d.data[i];gg+=d.data[i+1];bb+=d.data[i+2];}
    const n=d.data.length/4;rgbs.push([Math.round(rr/n),Math.round(gg/n),Math.round(bb/n)]);
  }
  rawData[SCAN_SEQ[scanIdx].f]=rgbs;
  if(navigator.vibrate)navigator.vibrate(80);
  const mg=document.getElementById('mgrid');mg.style.display='grid';
  mg.innerHTML=rgbs.map(([r,g,b],i)=>'<div class="mcell" style="background:rgb('+r+','+g+','+b+')">'+(i===4?'⭐':'')+'</div>').join('');
  scanIdx++;
  if(scanIdx>=SCAN_SEQ.length){
    document.getElementById('title').textContent='✅ 6面拍攝完成！';
    document.getElementById('sub').textContent='按下方按鈕分析顏色';
    document.getElementById('info').textContent='';
    document.getElementById('btnRow').innerHTML='<button class="btn" onclick="doClassify()">🔍 分析顏色</button>';
  }else{
    const next=SCAN_SEQ[scanIdx];
    document.getElementById('title').textContent='下一面：'+next.name;
    document.getElementById('sub').textContent=next.guide;
    document.getElementById('dots').innerHTML=SCAN_SEQ.map((_,i)=>'<div class="td'+(i<scanIdx?' done':'')+(i===scanIdx?' now':'')+'"></div>').join('');
    document.getElementById('info').textContent='✅ 已拍 '+scanIdx+'/6，轉好後按拍照';
    document.getElementById('btnRow').innerHTML='<button class="btn" onclick="doScanCapture()">📸 拍照</button>';
  }
}
// ===== COLOR CLASSIFY =====
function showError(msg){document.getElementById('info').innerHTML='<span style="color:#E94560">'+msg+'</span>';document.getElementById('btnRow').innerHTML='<button class="btn" onclick="location.reload()">重新開始</button>';}
function showFacePreviews(id){
  const el=document.getElementById(id);if(!el)return;
  el.style.display='flex';el.style.gap='4px';el.style.justifyContent='center';el.style.flexWrap='wrap';el.style.width='auto';el.style.gridTemplateColumns='';
  el.innerHTML=['U','R','F','D','L','B'].map(f=>{const c=faceColors[f]||[];return '<div style="text-align:center"><div style="font-size:8px;color:rgba(255,255,255,.4)">'+FLABEL[f]+'</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:36px">'+c.map(x=>'<div style="width:10px;height:10px;border-radius:2px;background:'+(CMAP[x]||'#333')+'"></div>').join('')+'</div></div>';}).join('');
}
function showEditableFaces(){
  const mg=document.getElementById('mgrid');mg.style.display='flex';mg.style.gap='6px';mg.style.justifyContent='center';mg.style.flexWrap='wrap';mg.style.width='auto';mg.style.gridTemplateColumns='';
  let html='';['U','R','F','D','L','B'].forEach(f=>{
    html+='<div style="text-align:center"><div style="font-size:9px;color:rgba(255,255,255,.5);margin-bottom:2px">'+FLABEL[f]+'</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px">';
    faceColors[f].forEach((c,i)=>{
      if(i===4)html+='<div style="width:22px;height:22px;border-radius:3px;background:'+(CMAP[c]||'#333')+';border:2px solid rgba(255,255,255,.3)"></div>';
      else html+='<div style="width:22px;height:22px;border-radius:3px;background:'+(CMAP[c]||'#333')+';cursor:pointer;border:1px solid rgba(255,255,255,.15)" onclick="cycleColor(\''+f+'\','+i+')"></div>';
    });html+='</div></div>';});mg.innerHTML=html;
}
function cycleColor(face,pos){const colors=['W','R','B','O','G','Y'];const cur=faceColors[face][pos];faceColors[face][pos]=colors[(colors.indexOf(cur)+1)%6];showEditableFaces();}
function doManualSolve(){
  // Validate: each color must appear exactly 9 times
  const cnt={};['U','R','F','D','L','B'].forEach(f=>faceColors[f].forEach(c=>{cnt[c]=(cnt[c]||0)+1;}));
  const ok=Object.values(cnt).every(v=>v===9)&&Object.keys(cnt).length===6;
  if(!ok){showError('每個顏色必須剛好 9 個！目前: '+Object.entries(cnt).map(([c,n])=>CN[c]+':'+n).join(' '));return;}
  doLBLSolve();
}

function doClassify(){try{doClassifyInner();}catch(e){showError('分析錯誤: '+e.message);}}
function doClassifyInner(){
  const FO=['U','R','F','D','L','B'];const all=[];
  FO.forEach(f=>{const r=rawData[f];if(!r)return;for(let i=0;i<9;i++)all.push({face:f,pos:i,rgb:r[i],color:null});});
  if(all.length!==54){showError('只有'+all.length+'個色塊');return;}
  const anchors={};FO.forEach(f=>{anchors[CC[f]]=rawData[f][4];});
  all.forEach(s=>{if(s.pos===4)s.color=CC[s.face];});
  function toHSV(r,g,b){const rf=r/255,gf=g/255,bf=b/255,mx=Math.max(rf,gf,bf),mn=Math.min(rf,gf,bf),d=mx-mn;const v=mx,s=mx>0?d/mx:0;let h=0;if(d>0.001){if(mx===rf)h=60*(((gf-bf)/d)%6);else if(mx===gf)h=60*((bf-rf)/d+2);else h=60*((rf-gf)/d+4);if(h<0)h+=360;}return[h,s,v];}
  function smartDist(r,g,b,ar,ag,ab,c){const[h,s,v]=toHSV(r,g,b);const[ah,as,av]=toHSV(ar,ag,ab);if(c==='W')return s*5+Math.abs(v-av)*2;if(s<0.15)return 10;let hd=Math.abs(h-ah);hd=Math.min(hd,360-hd);const inRO=(h>300||h<40)&&(ah>300||ah<40);if(inRO){return Math.abs(r-ar)/255*100+Math.abs(v-av)*50+hd*0.5;}return hd+Math.abs(v-av)*30;}
  const nonC=all.filter(s=>s.pos!==4);
  nonC.forEach(s=>{s.dists={};Object.entries(anchors).forEach(([c,[ar,ag,ab]])=>{const[r,g,b]=s.rgb;s.dists[c]=smartDist(r,g,b,ar,ag,ab,c);});});
  const cnt={W:1,R:1,B:1,O:1,G:1,Y:1};const cands=[];
  nonC.forEach(s=>{Object.entries(s.dists).forEach(([c,d])=>{cands.push({s,c,d});});});
  cands.sort((a,b)=>a.d-b.d);
  cands.forEach(({s,c})=>{if(s.color||cnt[c]>=9)return;s.color=c;cnt[c]++;});
  nonC.filter(s=>!s.color).forEach(s=>{const a=Object.entries(cnt).find(([c,n])=>n<9);if(a){s.color=a[0];cnt[a[0]]++;}});
  nonC.forEach(s=>{const sorted=Object.entries(s.dists).sort((a,b)=>a[1]-b[1]);s.bestDist=sorted[0][1];s.secondColor=sorted[1][0];s.secondDist=sorted[1][1];s.ambiguity=s.secondDist>0?(s.secondDist-s.bestDist)/s.secondDist:1;});
  FO.forEach(f=>{faceColors[f]=all.filter(s=>s.face===f).sort((a,b)=>a.pos-b.pos).map(s=>s.color);});
  // Edge constraint validation
  const invalidPairs=[['R','O'],['W','Y'],['B','G']];
  function isInvalidEdge(c1,c2){return invalidPairs.some(([a,b])=>(c1===a&&c2===b)||(c1===b&&c2===a))||c1===c2;}
  const edgeConstraints=[['F',5,'R',3],['R',5,'B',3],['B',5,'L',3],['L',5,'F',3],['F',2,'R',0],['R',2,'B',0],['B',2,'L',0],['L',2,'F',0],['F',8,'R',6],['R',8,'B',6],['B',8,'L',6],['L',8,'F',6],['U',6,'F',0],['U',7,'F',1],['U',8,'F',2],['U',8,'R',0],['U',5,'R',1],['U',2,'R',2],['U',2,'B',0],['U',1,'B',1],['U',0,'B',2],['U',0,'L',0],['U',3,'L',1],['U',6,'L',2],['D',0,'F',6],['D',1,'F',7],['D',2,'F',8],['D',2,'R',6],['D',5,'R',7],['D',8,'R',8],['D',8,'B',6],['D',7,'B',7],['D',6,'B',8],['D',0,'L',8],['D',3,'L',7],['D',6,'L',6]];
  for(let pass=0;pass<3;pass++){for(const[f1,p1,f2,p2]of edgeConstraints){const c1=faceColors[f1][p1],c2=faceColors[f2][p2];if(isInvalidEdge(c1,c2)){const s1=nonC.find(s=>s.face===f1&&s.pos===p1),s2=nonC.find(s=>s.face===f2&&s.pos===p2);if(!s1||!s2)continue;if(s1.ambiguity<s2.ambiguity){s1.color=s1.secondColor;faceColors[f1][p1]=s1.secondColor;}else{s2.color=s2.secondColor;faceColors[f2][p2]=s2.secondColor;}}}}
  // Validate count
  let fl='';FO.forEach(f=>{faceColors[f].forEach(x=>fl+=C2F[x]||'?');});
  const fcnt={};for(const ch of fl)fcnt[ch]=(fcnt[ch]||0)+1;
  const ok2=!fl.includes('?')&&Object.values(fcnt).every(v=>v===9);
  if(!ok2){
    document.getElementById('info').innerHTML='<span style="color:#FFA500">顏色辨識可能有誤，請確認或手動修正</span>';
    showEditableFaces();

function getSafeKickouts(targetSlot, solvedSlots) {
  var safe = ['FR','FL','BR','BL'].filter(function(s) {
    return solvedSlots.indexOf(s) < 0 || s === targetSlot;
  });
  var kicks = [];
  safe.forEach(function(sl) {
    if(sl==='FR'){kicks.push(["R'","D","R"],["R'","D'","R"],["R'","D2","R"],["F","D","F'"],["F","D'","F'"],["F","D2","F'"]);}
    if(sl==='FL'){kicks.push(["L","D","L'"],["L","D'","L'"],["L","D2","L'"],["F'","D","F"],["F'","D'","F"],["F'","D2","F"]);}
    if(sl==='BR'){kicks.push(["R","D","R'"],["R","D'","R'"],["R","D2","R'"],["B'","D","B"],["B'","D'","B"],["B'","D2","B"]);}
    if(sl==='BL'){kicks.push(["L'","D","L"],["L'","D'","L"],["L'","D2","L"],["B","D","B'"],["B","D'","B'"],["B","D2","B'"]);}
  });
  return kicks;
}

function smartExtract(state, pair, solvedSlots) {
  var cc = pair.corner, ee = pair.edge;
  function bothInD(st) {
    var c = _lbl.findCorner(st, cc[0], cc[1], cc[2]);
    var e = _lbl.findEdge(st, ee[0], ee[1]);
    return c && e && c.layer === 'D' && e.layer === 'D';
  }
  if (bothInD(state)) return [];
  var kicks = getSafeKickouts(pair.slot, solvedSlots);
  // Depth 1
  for (var i = 0; i < kicks.length; i++) {
    var t = _lbl.clone(state); _lbl.dms(t, kicks[i]);
    if (bothInD(t) && allIntact(t, solvedSlots)) return kicks[i];
  }
  // Depth 2
  for (var i2 = 0; i2 < kicks.length; i2++) {
    var t1 = _lbl.clone(state); _lbl.dms(t1, kicks[i2]);
    if (!allIntact(t1, solvedSlots)) continue;
    for (var j = 0; j < kicks.length; j++) {
      var t2 = _lbl.clone(t1); _lbl.dms(t2, kicks[j]);
      if (bothInD(t2) && allIntact(t2, solvedSlots)) return kicks[i2].concat(kicks[j]);
    }
  }
  return null;
}


// === CFOP F2L Main: Full-search kickout × D-prefix × formula ===
_lbl.solveCFOPF2L = function(state) {
  var steps = [], solvedSlots = [];
  var dPrefixes = [[], ['D'], ['D2'], ["D'"]];

  for (var pi = 0; pi < F2L_PAIRS.length; pi++) {
    var pair = F2L_PAIRS[pi];
    if (isPairSolved(state, pair)) { solvedSlots.push(pair.slot); continue; }

    var kicks = getSafeKickouts(pair.slot, solvedSlots);
    var allKicks = [[]];
    for (var k1 = 0; k1 < kicks.length; k1++) allKicks.push(kicks[k1]);
    for (var k2 = 0; k2 < kicks.length; k2++)
      for (var k3 = 0; k3 < kicks.length; k3++)
        allKicks.push(kicks[k2].concat(kicks[k3]));

    var bestMoves = null, bestLen = 999;
    for (var kIdx = 0; kIdx < allKicks.length; kIdx++) {
      var kick = allKicks[kIdx];
      var stK = _lbl.clone(state); _lbl.dms(stK, kick);
      if (!allIntact(stK, solvedSlots)) continue;
      for (var dpi = 0; dpi < 4; dpi++) {
        for (var fi = 0; fi < F2L_FR_FORMULAS.length; fi++) {
          var mapped = mapFormula(F2L_FR_FORMULAS[fi], pair.slot);
          var cand = kick.concat(dPrefixes[dpi]).concat(mapped);
          if (cand.length >= bestLen) continue;
          var tv = _lbl.clone(state); _lbl.dms(tv, cand);
          if (isPairSolved(tv, pair) && allIntact(tv, solvedSlots)) {
            bestLen = cand.length; bestMoves = cand;
          }
        }
      }
      if (bestLen <= 8) break;
    }

    if (bestMoves) {
      steps.push({explain:'F2L【'+pair.name+'】('+bestMoves.length+'步)',moves:bestMoves});
      _lbl.dms(state, bestMoves); solvedSlots.push(pair.slot); continue;
    }

    // LBL fallback
    var ct=_lbl.CORNER_TARGETS.find(function(c){return c.colors.slice().sort().join('')===pair.corner.slice().sort().join('');});
    if(ct){for(var att=0;att<8;att++){if(state.U[ct.uPos]==='W'&&state[ct.f1][ct.p1]===state[ct.f1][4]&&state[ct.f2][ct.p2]===state[ct.f2][4])break;var c2=_lbl.findCorner(state,ct.colors[0],ct.colors[1],ct.colors[2]);if(!c2)break;if(c2.layer==='U'){var ks=_lbl.CORNER_TARGETS.filter(function(x){return x.slot===c2.slot;})[0];if(ks){_lbl.dms(state,ks.kickout);steps.push({explain:'LBL踢出',moves:ks.kickout});}continue;}if(c2.layer==='D'){var sd=_lbl.dMovesToSlot(c2.slot,ct.dBelow);if(sd.length>0){_lbl.dms(state,sd);steps.push({explain:'LBL旋轉',moves:sd});}var ins=[],cnt=0;for(var r2=0;r2<6;r2++){ins=ins.concat(ct.insert);cnt++;var t3=_lbl.clone(state);_lbl.dms(t3,ins);if(t3.U[ct.uPos]==='W'&&t3[ct.f1][ct.p1]===t3[ct.f1][4]&&t3[ct.f2][ct.p2]===t3[ct.f2][4])break;}_lbl.dms(state,ins);steps.push({explain:'LBL'+cnt+'次裝入',moves:ins});break;}}}
    var mid=_lbl.MID.find(function(m){return m.n===pair.name;});
    if(mid){for(var a3=0;a3<8;a3++){if(_lbl.edgeOK(state,mid))break;var e2=_lbl.findEdge(state,mid.c1,mid.c2);if(!e2)break;if(e2.layer==='E'){var kf=_lbl.F2L_FORMULAS[e2.slot];if(kf){_lbl.dms(state,kf.right);steps.push({explain:'LBL邊塊踢出',moves:kf.right});}continue;}if(e2.layer==='D'){var cs=[];for(var k=0;k<_lbl.MID.length;k++){if(_lbl.MID[k].n!==pair.name&&_lbl.edgeOK(state,_lbl.MID[k]))cs.push(_lbl.MID[k]);}var sol=_lbl.findF2LInsert(state,mid,cs);if(sol){if(sol.setup.length>0){_lbl.dms(state,sol.setup);steps.push({explain:'LBL對齊',moves:sol.setup});}_lbl.dms(state,sol.formula);steps.push({explain:'LBL插入',moves:sol.formula});}break;}}}
    if(isPairSolved(state,pair))solvedSlots.push(pair.slot);
  }
  return{steps:steps};
};

// === CFOP Engine v2 ===
_lbl.cfopEngine = function(init) {
  var s = _lbl.clone(init), script = [], mc = 0;
  function recOnly(stage, explain, moves) {
    if (!moves || !moves.length) return;
    script.push({stage: stage, explain: explain, moves: moves}); mc += moves.length;
  }
  var r1 = _lbl.solveCrossIDDFS(s); if (r1) r1.steps.forEach(function(st) { recOnly('Cross', st.explain, st.moves); });
  var rF = _lbl.solveCFOPF2L(s); if (rF) rF.steps.forEach(function(st) { recOnly('F2L', st.explain, st.moves); });
  var r4 = _lbl.solveStage4(s); if (r4) r4.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); });
  var r5 = _lbl.solveStage5(s); if (r5 && r5.moves.length > 0) { _lbl.dms(s, r5.moves); r5.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); }); }
  var r6 = _lbl.solveStage6(s); if (r6) r6.steps.forEach(function(st) { recOnly('PLL', st.explain, st.moves); });
  var r7 = _lbl.solveStage7(s); if (r7) r7.steps.forEach(function(st) { if (st.moves.length > 0) recOnly('PLL', st.explain, st.moves); });
  return { script: script, mc: mc, state: s };
};

// ================================================================
// 2-Look OLL Step 2: OCLL (corner orientation → D face all yellow)
// ================================================================
var OCLL_FORMULAS = [
  ["R'","D'","R","D'","R'","D2","R"],                           // Sune (7步)
  ["R'","D2","R","D","R'","D","R"],                             // Anti-Sune (7步)
  ["R'","D2","R2","D","R2","D","R2","D2","R'"],                 // Pi (9步)
  ["R'","D'","R","D'","R'","D","R","D'","R'","D2","R"],         // H (11步)
  ["R'","D2","R","D","R'","D'","R","D","R'","D","R"],           // L (11步)
  ["R2","U","R'","D2","R","U'","R'","D2","R'"],                 // U (9步)
];

function dFaceAllYellow(st) {
  return st.D[0]==='Y'&&st.D[1]==='Y'&&st.D[2]==='Y'&&st.D[3]==='Y'&&
         st.D[4]==='Y'&&st.D[5]==='Y'&&st.D[6]==='Y'&&st.D[7]==='Y'&&st.D[8]==='Y';
}

_lbl.solveOCLL = function(state) {
  if (dFaceAllYellow(state)) return {steps:[]};
  var dS = [[], ['D'], ['D2'], ["D'"]];
  // Single formula
  for (var di=0;di<4;di++) for (var fi=0;fi<OCLL_FORMULAS.length;fi++) {
    var mv=dS[di].concat(OCLL_FORMULAS[fi]);
    var ts=_lbl.clone(state);_lbl.dms(ts,mv);
    if(dFaceAllYellow(ts)) { _lbl.dms(state,mv); return {steps:[{explain:'OLL角塊方向',moves:mv}]}; }
  }
  // Double formula
  for (var d1=0;d1<4;d1++) for (var f1=0;f1<OCLL_FORMULAS.length;f1++) {
    var m1=dS[d1].concat(OCLL_FORMULAS[f1]);
    var t1=_lbl.clone(state);_lbl.dms(t1,m1);
    for (var d2=0;d2<4;d2++) for (var f2=0;f2<OCLL_FORMULAS.length;f2++) {
      var m2=dS[d2].concat(OCLL_FORMULAS[f2]);
      var t2=_lbl.clone(t1);_lbl.dms(t2,m2);
      if(dFaceAllYellow(t2)){var all=m1.concat(m2);_lbl.dms(state,all);return{steps:[{explain:'OLL角塊方向',moves:all}]};}
    }
  }
  return {steps:[]};
};

// ================================================================
// 2-Look PLL: CP (T-perm) + EP (Ua/Ub/H/Z)
// ================================================================
var TPERM = ["R'","D'","R","D","R","F'","R2","D","R","D","R'","D'","R","F"];
var EP_FORMULAS = [
  ["R'","D","R'","D'","R'","D'","R'","D","R","D","R2"],           // Ua (11步)
  ["R2","D'","R'","D'","R","D","R","D","R","D'","R"],             // Ub (11步)
  ["R2","D2","R'","D2","R2","D2","R2","D2","R'","D2","R2"],       // H (11步)
  ["R","D","R'","D","R'","D'","R'","D","R","D'","R'","D'","R2","D","R"], // Z (15步)
];

function cornersOK(st) {
  return st.F[8]===st.F[4]&&st.R[6]===st.R[4]&&st.B[6]===st.B[4]&&st.L[8]===st.L[4]&&
         st.F[6]===st.F[4]&&st.R[8]===st.R[4]&&st.B[8]===st.B[4]&&st.L[6]===st.L[4];
}

function allBottomOK(st) {
  return ['F','R','B','L'].every(function(f){
    return st[f][6]===st[f][4]&&st[f][7]===st[f][4]&&st[f][8]===st[f][4];
  });
}

_lbl.solve2LookPLL = function(state) {
  var steps=[], dS=[[], ['D'], ['D2'], ["D'"]];
  
  // CP: forward-check T-perm × 4 D-setups
  if (!cornersOK(state)) {
    var cpDone = false;
    // Single T-perm
    for (var di=0;di<4&&!cpDone;di++) {
      var mv=dS[di].concat(TPERM);
      var ts=_lbl.clone(state);_lbl.dms(ts,mv);
      for(var adj=0;adj<4;adj++){if(cornersOK(ts)){
        var full=mv.slice();for(var a2=0;a2<adj;a2++)full.push('D');
        steps.push({explain:'PLL角塊排列',moves:full});_lbl.dms(state,full);cpDone=true;break;}
        _lbl.dm(ts,'D');
      }
    }
    // Double T-perm
    if (!cpDone) {
      for(var d1=0;d1<4&&!cpDone;d1++) for(var d2=0;d2<4&&!cpDone;d2++){
        var m2=dS[d1].concat(TPERM).concat(dS[d2]).concat(TPERM);
        var ts2=_lbl.clone(state);_lbl.dms(ts2,m2);
        for(var adj2=0;adj2<4;adj2++){if(cornersOK(ts2)){
          for(var a3=0;a3<adj2;a3++)m2.push('D');
          steps.push({explain:'PLL角塊排列(雙T)',moves:m2});_lbl.dms(state,m2);cpDone=true;break;}
          _lbl.dm(ts2,'D');
        }
      }
    }
  }
  
  // EP: forward-check 4 formulas × 4 D-setups
  if (!allBottomOK(state)) {
    var epDone = false;
    for(var di2=0;di2<4&&!epDone;di2++) for(var fi=0;fi<EP_FORMULAS.length&&!epDone;fi++){
      var mv3=dS[di2].concat(EP_FORMULAS[fi]);
      var ts3=_lbl.clone(state);_lbl.dms(ts3,mv3);
      for(var adj3=0;adj3<4;adj3++){if(allBottomOK(ts3)){
        for(var a4=0;a4<adj3;a4++)mv3.push('D');
        steps.push({explain:'PLL邊塊排列',moves:mv3});_lbl.dms(state,mv3);epDone=true;break;}
        _lbl.dm(ts3,'D');
      }
    }
  }
  
  // Final D-adjust
  for(var fd=0;fd<4;fd++){
    if(allBottomOK(state))break;
    _lbl.dm(state,'D');steps.push({explain:'最終對齊',moves:['D']});
  }
  
  return{steps:steps};
};

// ================================================================
// Override cfopEngine to use OCLL + 2-Look PLL
// ================================================================
_lbl.cfopEngine = function(init) {
  var s = _lbl.clone(init), script = [], mc = 0;
  function recOnly(stage, explain, moves) {
    if (!moves || !moves.length) return;
    var opt=optimizeMoves(moves);if(!opt.length)return;script.push({stage:stage,explain:explain,moves:opt});mc+=opt.length;
  }

  // Cross (IDDFS)
  var r1 = _lbl.solveCrossIDDFS(s);
  if (r1) r1.steps.forEach(function(st) { recOnly('Cross', st.explain, st.moves); });

  // F2L v2 (Smart Extract + Translated Formulas)
  var rF = _lbl.solveCFOPF2L(s);
  if (rF) rF.steps.forEach(function(st) { recOnly('F2L', st.explain, st.moves); });

  // OLL Step 1: Yellow cross (S4)
  var r4 = _lbl.solveStage4(s);
  if (r4) r4.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); });

  // OLL Step 2: Corner orientation (OCLL)
  var rOCLL = _lbl.solveOCLL(s);
  if (rOCLL) rOCLL.steps.forEach(function(st) { recOnly('OLL', st.explain, st.moves); });

  // PLL: 2-Look (CP + EP)
  var rPLL = _lbl.solve1LookPLL(s);
  if (rPLL) rPLL.steps.forEach(function(st) { recOnly('PLL', st.explain, st.moves); });

  // Peephole: optimize across stage boundaries (D D' → [], R R' → [], etc.)
  var allM=[],bounds=[];
  script.forEach(function(st){bounds.push({stage:st.stage,explain:st.explain,start:allM.length});allM=allM.concat(st.moves);bounds[bounds.length-1].end=allM.length;});
  var opt=optimizeMoves(allM);
  // Rebuild script with optimized moves
  if(opt.length<allM.length){
    var newScript=[],pos=0;
    for(var bi=0;bi<bounds.length;bi++){
      var b=bounds[bi];
      var origLen=b.end-b.start;
      var ratio=origLen/Math.max(allM.length,1);
      var newEnd=Math.min(Math.round(pos+ratio*opt.length),opt.length);
      if(bi===bounds.length-1)newEnd=opt.length;
      var chunk=opt.slice(pos,newEnd);
      if(chunk.length>0)newScript.push({stage:b.stage,explain:b.explain,moves:chunk});
      pos=newEnd;
    }
    script=newScript;
  }
  mc=opt.length;

  return { script: script, mc: mc, state: s };
};

// ================================================================
// CFOP Cross: In-place IDDFS (保證 8 步以內，平均 ~6 步)
// ================================================================
_lbl.solveCrossIDDFS = function(initState) {
  var MOVES = ['U',"U'","U2",'D',"D'","D2",'R',"R'","R2",'L',"L'","L2",'F',"F'","F2",'B',"B'","B2"];
  var UNDOS = ["U'",'U',"U2","D'",'D',"D2","R'",'R',"R2","L'",'L',"L2","F'",'F',"F2","B'",'B',"B2"];
  var FGRP = [0,0,0,1,1,1,2,2,2,3,3,3,4,4,4,5,5,5];
  var OPP = {0:1,1:0,2:3,3:2,4:5,5:4};

  var s = _lbl.clone(initState);
  var solution = [];

  function heuristic() {
    var h = 0;
    if (!(s.U[7]==='W'&&s.F[1]==='R')) h++;
    if (!(s.U[5]==='W'&&s.R[1]==='B')) h++;
    if (!(s.U[1]==='W'&&s.B[1]==='O')) h++;
    if (!(s.U[3]==='W'&&s.L[1]==='G')) h++;
    return h;
  }

  function dfs(depth, lastF, lastLF) {
    var h = heuristic();
    if (h === 0) return true;
    if (h > depth) return false;
    if (depth === 0) return false;

    for (var i = 0; i < 18; i++) {
      var f = FGRP[i];
      if (f === lastF) continue;
      if (f === lastLF && OPP[f] === lastF) continue;
      if (OPP[f] === lastF && f > lastF) continue;

      _lbl.dm(s, MOVES[i]);
      if (dfs(depth - 1, f, lastF)) {
        solution.unshift(MOVES[i]);
        _lbl.dm(s, UNDOS[i]);
        return true;
      }
      _lbl.dm(s, UNDOS[i]);
    }
    return false;
  }

  for (var maxD = 0; maxD <= 8; maxD++) {
    solution = [];
    if (dfs(maxD, -1, -1)) {
      _lbl.dms(initState, solution);
      return {steps: [{explain: '白色十字('+solution.length+'步)', moves: solution}]};
    }
  }

  return _lbl.solveStage1(initState);
};

// ================================================================
// 1-Look PLL: 21 formulas + forward-checking (avg 15 steps)
// ================================================================
var PLL_21 = [
  ["R'","D","R'","D'","R'","D'","R'","D","R","D","R2"],
  ["R2","D'","R'","D'","R","D","R","D","R","D'","R"],
  ["R2","D2","R'","D2","R2","D2","R2","D2","R'","D2","R2"],
  ["R","D","R'","D","R'","D'","R'","D","R","D'","R'","D'","R2","D","R"],
  ["R","F'","R","B2","R'","F","R","B2","R2"],
  ["R2","B2","R'","F'","R","B2","R'","F","R'"],
  ["R'","B","R","F'","R'","B'","R","F","R'","B'","R","F'","R'","B","R","F"],
  ["R'","D'","R","D","R","F'","R2","D","R","D","R'","D'","R","F"],
  ["R'","D'","R","F","R'","D'","R","D","R","F'","R2","D","R"],
  ["L","D","L'","F'","L","D","L'","D'","L'","F","L2","D'","L'"],
  ["R","D2","R'","D2","R","F'","R'","D'","R","D","R","F","R2"],
  ["L'","D2","L","D2","L'","F","L","D","L'","D'","L'","F'","L2"],
  ["R","D","F","R'","D'","R","D","R","F'","R2","D","R","D","R'","D'","R","D'","R'"],
  ["R","D'","R","D","B","R","B2","D","B","D'","B","R'","B'","R'"],
  ["F'","R'","D","R","D","R'","D'","R","F","R'","D'","R","D","R","F'","R'","F"],
  ["R'","D'","R","D'","R'","D'","R","F","R'","D'","R","D","R","F'","R2","D","R","D2","R'","D","R"],
  ["R","D'","R","F'","R'","F","R'","D","R","F","D'","F'","R'","D'","R","D","R'"],
  ["R2","D'","R","D'","R","D","R'","D","R2","D","U'","R","D'","R'","U"],
  ["R","D","R'","D'","U","R2","D'","R","D'","R'","D","R'","D","R2","U'"],
  ["R2","D","R'","D","R'","D'","R","D'","R2","D'","U","R'","D","R","U'"],
  ["R'","D'","R","D","U'","R2","D","R'","D","R","D'","R","D'","R2","U"]
];

_lbl.solve1LookPLL = function(state) {
  var dS = [[], ['D'], ['D2'], ["D'"]];
  function allOK(st) {
    return ['F','R','B','L'].every(function(f){
      return st[f][6]===st[f][4]&&st[f][7]===st[f][4]&&st[f][8]===st[f][4];
    });
  }
  if (allOK(state)) return {steps:[]};
  
  for (var di = 0; di < 4; di++) {
    for (var pi = 0; pi < PLL_21.length; pi++) {
      var mv = dS[di].concat(PLL_21[pi]);
      var ts = _lbl.clone(state); _lbl.dms(ts, mv);
      for (var adj = 0; adj < 4; adj++) {
        if (allOK(ts)) {
          var full = mv.slice(); for (var a = 0; a < adj; a++) full.push('D');
          _lbl.dms(state, full);
          return {steps: [{explain:'PLL(1-Look)', moves:full}]};
        }
        _lbl.dm(ts, 'D');
      }
    }
  }
  // Fallback to 2-Look
  return _lbl.solve2LookPLL(state);
};
// ===== INTEGRATION: faceColors → LBL Engine → UI =====

function doLBLSolve(){
  // Stop camera
  try{if(vid&&vid.srcObject){vid.srcObject.getTracks().forEach(function(t){t.stop();});vid.srcObject=null;}}catch(e){}
  if(vid)vid.style.display='none';
  document.querySelector('.wrap').style.background='#000';
  if(ov)ov.style.display='none';
  
  document.getElementById('topBar').style.display='none';
  document.getElementById('botBar').style.display='none';
  
  // Show computing overlay
  document.getElementById('info').textContent='🧩 CFOP v3 計算中...';
  
  // Run engine
  setTimeout(function(){
    try{
      var initState={};
      ['U','R','F','D','L','B'].forEach(function(f){initState[f]=faceColors[f].slice();});
      var result=_lbl.cfopEngine(initState);
      
      // Verify
      var solved=_lbl.solved(),ok=true;
      ['U','R','F','D','L','B'].forEach(function(f){for(var i=0;i<9;i++){if(result.state[f][i]!==solved[f][i])ok=false;}});
      
      if(!ok){
        alert('⚠️ CFOP 引擎無法完全還原此狀態。\n可能是顏色辨識有誤，請重新掃描或手動修正。');
        location.reload();
        return;
      }
      
      // Build solution array + stage markers
      solution=[];
      window._lblStageMarkers=[];
      var totalMoves=0;
      for(var i=0;i<result.script.length;i++){
        var step=result.script[i];
        window._lblStageMarkers.push({idx:totalMoves,stage:step.stage,explain:step.explain});
        for(var j=0;j<step.moves.length;j++)solution.push(step.moves[j]);
        totalMoves+=step.moves.length;
      }
      
      // Setup cubeState
      ['U','R','F','D','L','B'].forEach(function(f){cubeState[f]=faceColors[f].slice();});
      solveStep=-1;
      mode='solve';
      
      showSolveStep();
      // Compute energy path
      setTimeout(function(){
        if(!window._lblStageMarkers||!solution.length)return;
        var replay={};['U','R','F','D','L','B'].forEach(function(f){replay[f]=faceColors[f].slice();});
        window._energyAtStep=[_lbl.getEnergyScore(replay)];
        window._initialEnergy=window._energyAtStep[0];
        for(var ei=0;ei<solution.length;ei++){_lbl.dm(replay,solution[ei]);window._energyAtStep.push(_lbl.getEnergyScore(replay));}
        window._lblStageMarkers.forEach(function(m,idx){
          var nextIdx=(idx+1<window._lblStageMarkers.length)?window._lblStageMarkers[idx+1].idx:solution.length;
          m.spell=classifySpell(m.stage,m.explain);
          m.energyBefore=window._energyAtStep[m.idx];
          m.energyAfter=window._energyAtStep[nextIdx];
          m.energyDrop=m.energyBefore-m.energyAfter;
        });
      },100);
    }catch(e){
      alert('CFOP 引擎錯誤: '+e.message);
      location.reload();
    }
  },50);
}

function getLBLStageInfo(stepIndex){
  if(!window._lblStageMarkers)return null;
  var m=window._lblStageMarkers,cur=null;
  for(var i=0;i<m.length;i++){if(m[i].idx<=stepIndex)cur=m[i];else break;}
  return cur;
}

// ===== CUBE STATE MANIPULATION =====
function rotateCW(f){var s=cubeState[f];cubeState[f]=[s[6],s[3],s[0],s[7],s[4],s[1],s[8],s[5],s[2]];}
function cycle(f){
  var s=cubeState;var t;
  switch(f){
    case'U':t=[s.F[0],s.F[1],s.F[2]];s.F[0]=s.R[0];s.F[1]=s.R[1];s.F[2]=s.R[2];s.R[0]=s.B[0];s.R[1]=s.B[1];s.R[2]=s.B[2];s.B[0]=s.L[0];s.B[1]=s.L[1];s.B[2]=s.L[2];s.L[0]=t[0];s.L[1]=t[1];s.L[2]=t[2];break;
    case'D':t=[s.F[6],s.F[7],s.F[8]];s.F[6]=s.L[6];s.F[7]=s.L[7];s.F[8]=s.L[8];s.L[6]=s.B[6];s.L[7]=s.B[7];s.L[8]=s.B[8];s.B[6]=s.R[6];s.B[7]=s.R[7];s.B[8]=s.R[8];s.R[6]=t[0];s.R[7]=t[1];s.R[8]=t[2];break;
    case'R':t=[s.F[2],s.F[5],s.F[8]];s.F[2]=s.D[2];s.F[5]=s.D[5];s.F[8]=s.D[8];s.D[2]=s.B[6];s.D[5]=s.B[3];s.D[8]=s.B[0];s.B[0]=s.U[8];s.B[3]=s.U[5];s.B[6]=s.U[2];s.U[2]=t[0];s.U[5]=t[1];s.U[8]=t[2];break;
    case'L':t=[s.F[0],s.F[3],s.F[6]];s.F[0]=s.U[0];s.F[3]=s.U[3];s.F[6]=s.U[6];s.U[0]=s.B[8];s.U[3]=s.B[5];s.U[6]=s.B[2];s.B[2]=s.D[6];s.B[5]=s.D[3];s.B[8]=s.D[0];s.D[0]=t[0];s.D[3]=t[1];s.D[6]=t[2];break;
    case'F':t=[s.U[6],s.U[7],s.U[8]];s.U[6]=s.L[8];s.U[7]=s.L[5];s.U[8]=s.L[2];s.L[2]=s.D[0];s.L[5]=s.D[1];s.L[8]=s.D[2];s.D[0]=s.R[6];s.D[1]=s.R[3];s.D[2]=s.R[0];s.R[0]=t[0];s.R[3]=t[1];s.R[6]=t[2];break;
    case'B':t=[s.U[0],s.U[1],s.U[2]];s.U[0]=s.R[2];s.U[1]=s.R[5];s.U[2]=s.R[8];s.R[2]=s.D[8];s.R[5]=s.D[7];s.R[8]=s.D[6];s.D[6]=s.L[0];s.D[7]=s.L[3];s.D[8]=s.L[6];s.L[0]=t[2];s.L[3]=t[1];s.L[6]=t[0];break;
  }
}

function classifySpell(stage,explain){
  if(stage==='Cross')return{name:'白色十字',icon:'✚',type:'吸入咒',typeIcon:'🧲'};
  if(explain.indexOf('踢出')>=0)return{name:'地洞脫逃',icon:'🕳️',type:'吸入咒',typeIcon:'🧲'};

  if(explain.indexOf('黃色十字')>=0)return{name:'十字咒',icon:'✚',type:'翻轉咒',typeIcon:'🔄'};

}
